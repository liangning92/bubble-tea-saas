pid /tmp/nginx.pid;
error_log /dev/stderr warn;
worker_processes auto;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        charset utf-8;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control "public, max-age=0, must-revalidate, no-transform" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-e9p449zBkVvRa6vfDcbtsZh3MWCjLlYz5c0+KpMa59c='; style-src 'sha256-oJE4nd4uXCFLd/ydWvt8lTiPqp0TgJNVpLRnohQCHlU='; base-uri 'none'; form-action 'none'; frame-ancestors 'none';" always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /favicon.ico {
            return 204;
        }

        location / {
            try_files $uri $uri/ =404;
        }
    }
}
