<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>TV</title>
    <link rel="stylesheet" href="./player.css" />
  </head>
  <body>
    <section id="pair">
      <h1 id="pair-title"></h1>
      <p id="pair-help"></p>
      <strong id="pin">··· ···</strong>
      <p id="status" role="status"></p>
      <button id="settings"></button>
    </section>
    <main id="display" hidden>
      <header>
        <img id="store-logo" alt="" hidden />
        <div>
          <h1 id="brand"></h1>
          <span id="channel"></span>
        </div>
        <span id="network"></span><button id="enable-sound" hidden></button
        ><time id="clock"></time>
      </header>
      <div id="content">
        <section id="media"></section>
        <section id="products"></section>
      </div>
      <section id="specials" hidden aria-label="Promosi harian"></section>
      <aside id="promotions"></aside>
      <footer><span id="ticker"></span></footer>
    </main>
    <dialog id="setup">
      <form method="dialog">
        <h2 id="setup-title"></h2>
        <label id="server-label" for="server"></label
        ><input id="server" type="url" autocomplete="off" /><label
          ><input id="allow-http" type="checkbox" /><span
            id="http-label"
          ></span></label
        ><button id="test" type="button"></button
        ><button id="save" type="button"></button
        ><button id="unpair" type="button"></button><button id="close"></button>
        <p id="test-result" role="status"></p>
      </form>
    </dialog>
    <section id="lottery" hidden aria-label="Lucky draw">
      <div class="draw-topline"><span class="draw-brand">YOUME</span><span id="draw-kicker"></span><span id="draw-preview" hidden></span></div>
      <div class="draw-layout">
        <div class="draw-board-wrap">
          <div id="draw-board" role="list"></div>
          <div class="draw-hub"><span id="draw-countdown"></span><span id="draw-hub-label"></span></div>
        </div>
        <div class="draw-copy" aria-live="polite">
          <p id="lottery-order"></p>
          <h2 id="draw-heading"></h2>
          <p id="draw-description"></p>
          <strong id="lottery-prize" hidden></strong>
          <section id="draw-coupon" hidden>
            <p id="draw-coupon-label"></p>
            <strong id="draw-coupon-code"></strong>
            <p id="draw-coupon-terms"></p>
            <p id="draw-coupon-photo"></p>
          </section>
          <p id="draw-footer"></p>
          <div class="draw-progress" aria-hidden="true"><i></i></div>
        </div>
      </div>
      <div id="draw-confetti" aria-hidden="true"></div>
    </section>
    <script src="./build.js" defer></script>
    <script src="./lottery.js" defer></script>
    <script src="./poster.js" defer></script>
    <script src="./player.js" defer></script>
  </body>
</html>
