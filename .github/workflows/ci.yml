name: CI - Test on push

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Check TypeScript
        run: npm run typecheck || npm run build --workspaces --if-present

  build-pos:
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd client-pos
          npm install --include=dev

      - name: Build POS
        run: |
          cd client-pos
          npm run build
          npm run build:electron:main
          npx electron-builder --win portable --x64

      - name: Upload POS build
        uses: actions/upload-artifact@v4
        with:
          name: pos-build
          path: client-pos/release/win-unpacked/
          retention-days: 7
