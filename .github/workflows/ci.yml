name: CI - Build and verify

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix server

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check translations
        run: npm run i18n:check

      - name: Check stop-loss and release gates with isolated synthetic files
        run: |
          node --test tests/stoploss/*.test.cjs
          PYTHONDONTWRITEBYTECODE=1 python3 tests/stoploss/desktop-upgrade-preflight.test.py

      - name: Verify real HTTP order receipt replay on isolated SQLite and PostgreSQL
        run: |
          runtime=$(node scripts/prepare-order-receipt-runtime.cjs | python3 -c 'import json,sys; print(json.load(sys.stdin)["runtime"])')
          export RECEIPT_RUNTIME="$runtime"
          export RECEIPT_DEPS="$GITHUB_WORKSPACE/server/node_modules:$GITHUB_WORKSPACE/node_modules"
          RECEIPT_PROVIDER=sqlite node tests/stoploss/order-receipt-http-check.cjs
          export PATH="$(pg_config --bindir):$PATH"
          RECEIPT_PROVIDER=postgresql node tests/stoploss/order-receipt-http-check.cjs

      - name: Build API and frontend applications
        run: npm run build
