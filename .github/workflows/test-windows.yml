name: Test Windows Electron

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          cd client-pos && npm install

      - name: Build
        run: |
          cd client-pos
          npm run build
          npm run build:electron:main
          npx electron-builder --win dir

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: client-pos/dist/

  test:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install @playwright/test
          npx playwright install chromium

      - name: Run Playwright Electron tests
        shell: pwsh
        env:
          ELECTRON_EXE: ${{ github.workspace }}\dist\win-unpacked\bubble-tea-pos.exe
        run: |
          $exe = Get-ChildItem dist/ -Recurse -Filter "*.exe" | Select-Object -First 1
          Write-Host "Testing: $($exe.FullName)"
          $env:ELECTRON_EXE = $exe.FullName
          Copy-Item -Recurse client-pos/e2e .
          Copy-Item client-pos/playwright.config.ts .
          npx playwright test --reporter=list 2>&1 | Tee-Object -Variable testOutput
          $testResult = $LASTEXITCODE
          Write-Host $testOutput
          if ($testResult -ne 0) { exit 1 }
          Write-Host "All Playwright tests passed"
