name: Test Windows Electron

on:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          cd client-pos
          npm install

      - name: Build POS
        run: |
          cd client-pos
          npm run build
          npm run build:electron:main

      - name: Build Electron app (portable dir)
        run: |
          cd client-pos
          npx electron-builder --win dir

      - name: List build output
        run: |
          Get-ChildItem client-pos/dist/ -Recurse -File | Select-Object FullName, @{N="SizeMB";E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

      - name: Find exe
        run: |
          $exe = Get-ChildItem client-pos/dist/ -Recurse -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            Write-Host "Found: $($exe.FullName)"
            Write-Host "##vso[task.setvariable variable=exePath;isOutput=true]$($exe.FullName)"
          } else {
            Write-Error "FAIL: No exe found"
            exit 1
          }

      - name: Smoke test - Launch app
        run: |
          $exePath = Get-ChildItem client-pos/dist/ -Recurse -Filter "*.exe" | Select-Object -First 1 | ForEach-Object { $_.FullName }
          Write-Host "Testing: $exePath"
          $port = 9222
          $errLog = "$env:TEMP\electron_err.log"
          $outLog = "$env:TEMP\electron_out.log"

          $proc = Start-Process $exePath -ArgumentList "--disable-gpu","--no-sandbox","--remote-debugging-port=$port" -PassThru -RedirectStandardError $errLog -RedirectStandardOutput $outLog
          Write-Host "Started process $($proc.Id)"
          Start-Sleep -Seconds 10

          if ($proc.HasExited) {
            Write-Error "CRASH: App exited with code $($proc.ExitCode)"
            if (Test-Path $errLog) { Get-Content $errLog | Select-Object -First 20 }
            exit 1
          }

          try {
            $response = Invoke-WebRequest "http://localhost:$port/json" -TimeoutSec 5 -ErrorAction Stop
            if ($response.StatusCode -eq 200) {
              Write-Host "OK: App is running, DevTools responding"
            }
          } catch {
            Write-Warning "DevTools not responding: $_"
          }

          Write-Host "OK: App started successfully"
          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Remove-Item $errLog,$outLog -ErrorAction SilentlyContinue
