name: Test Windows Electron

on:
  workflow_dispatch:

jobs:
  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          cd client-pos
          npm install

      - name: Build POS
        run: |
          cd client-pos
          npm run build
          npm run build:electron:main

      - name: Build Electron package (unpacked dir)
        run: |
          cd client-pos
          npx electron-builder --win portable --dir

      - name: Verify build output
        run: |
          Get-ChildItem client-pos/release/win-unpacked/ | Select-Object Name, Length
          if (Test-Path "client-pos/release/win-unpacked/BubbleTeaPOS.exe") {
            Write-Host "OK: BubbleTeaPOS.exe exists"
          } else {
            Write-Error "FAIL: BubbleTeaPOS.exe not found"
            exit 1
          }
          if (Test-Path "client-pos/release/win-unpacked/resources/app/dist/index.html") {
            Write-Host "OK: index.html exists"
          } else {
            Write-Error "FAIL: index.html not found"
            exit 1
          }
          if (Test-Path "client-pos/release/win-unpacked/resources/app/dist-electron/electron/main.js") {
            Write-Host "OK: main.js exists"
          } else {
            Write-Error "FAIL: main.js not found"
            exit 1
          }

      - name: Smoke test - Launch app briefly
        run: |
          $exePath = "client-pos/release/win-unpacked/BubbleTeaPOS.exe"
          $port = 9222
          $errLog = "$env:TEMP\electron_err.log"
          $outLog = "$env:TEMP\electron_out.log"

          $proc = Start-Process $exePath -ArgumentList "--disable-gpu","--no-sandbox","--remote-debugging-port=$port" -PassThru -RedirectStandardError $errLog -RedirectStandardOutput $outLog
          Write-Host "Started process $($proc.Id)"
          Start-Sleep -Seconds 8

          if ($proc.HasExited) {
            Write-Error "CRASH: App exited with code $($proc.ExitCode)"
            if (Test-Path $errLog) { Get-Content $errLog | Select-Object -First 20 }
            exit 1
          }

          # Check if DevTools port responds (proves renderer started)
          try {
            $response = Invoke-WebRequest "http://localhost:$port/json" -TimeoutSec 5 -ErrorAction Stop
            if ($response.StatusCode -eq 200) {
              Write-Host "OK: App is running, DevTools responding"
            }
          } catch {
            Write-Warning "DevTools not responding, but app is still running"
          }

          Write-Host "OK: App started successfully and is running"
          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Remove-Item $errLog,$outLog -ErrorAction SilentlyContinue
