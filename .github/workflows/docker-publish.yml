name: Build and Push Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - 'client-admin/**'
      - 'client-pos/**'
      - 'client-staff/**'
      - 'shared/**'
      - 'docker/**'
      - 'Dockerfile'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/bubble-tea

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels, tags) for API
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Admin
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Admin image
        uses: docker/build-push-action@v6
        with:
          context: ./client-admin
          push: true
          tags: ${{ steps.meta-admin.outputs.tags }}
          labels: ${{ steps.meta-admin.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for POS
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-pos
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push POS image
        uses: docker/build-push-action@v6
        with:
          context: ./client-pos
          push: true
          tags: ${{ steps.meta-pos.outputs.tags }}
          labels: ${{ steps.meta-pos.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Staff
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-staff
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Staff image
        uses: docker/build-push-action@v6
        with:
          context: ./client-staff
          push: true
          tags: ${{ steps.meta-staff.outputs.tags }}
          labels: ${{ steps.meta-staff.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## ✅ Docker Images Built & Pushed"
          echo ""
          echo "| Service | Image |"
          echo "|---------|-------|"
          echo "| API | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest\` |"
          echo "| Admin | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:latest\` |"
          echo "| POS | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-pos:latest\` |"
          echo "| Staff | \`${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-staff:latest\` |"
          echo ""
          echo "**服务器手动更新命令：**"
          echo ""
          echo '```bash'
          echo "# 登录 GHCR（只需一次）"
          echo "echo \$GITHUB_TOKEN | docker login ghcr.io -u \$GITHUB_ACTOR --password-stdin"
          echo ""
          echo "# 拉取最新镜像"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-admin:latest"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-pos:latest"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-staff:latest"
          echo ""
          echo "# 重启容器"
          echo "docker-compose -f docker-compose.yml up -d"
          echo '```'
