name: Build and Push Docker Images

on:
  push:
    branches:
      - master
    paths:
      - 'server/**'
      - 'client-admin/**'
      - 'client-pos/**'
      - 'client-staff/**'
      - 'shared/**'
      - 'Dockerfile'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: tags
        run: |
          SHA_TAG=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_tag=${SHA_TAG}" >> $GITHUB_OUTPUT
          echo "branch_tag=${{ github.ref_name }}-${SHA_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        run: |
          API_IMG=ghcr.io/${{ env.OWNER }}/bubble-tea-api
          docker build ./server -t ${API_IMG}:latest -t ${API_IMG}:${{ steps.tags.outputs.sha_tag }} -t ${API_IMG}:${{ steps.tags.outputs.branch_tag }}
          docker push -a ${API_IMG}

      - name: Build and push Admin image
        run: |
          ADMIN_IMG=ghcr.io/${{ env.OWNER }}/bubble-tea-admin
          docker build --no-cache ./client-admin -t ${ADMIN_IMG}:latest -t ${ADMIN_IMG}:${{ steps.tags.outputs.sha_tag }} -t ${ADMIN_IMG}:${{ steps.tags.outputs.branch_tag }}
          docker push -a ${ADMIN_IMG}

      - name: Build and push POS image
        run: |
          POS_IMG=ghcr.io/${{ env.OWNER }}/bubble-tea-pos
          docker build --no-cache ./client-pos -t ${POS_IMG}:latest -t ${POS_IMG}:${{ steps.tags.outputs.sha_tag }} -t ${POS_IMG}:${{ steps.tags.outputs.branch_tag }}
          docker push -a ${POS_IMG}

      - name: Build and push Staff image
        run: |
          STAFF_IMG=ghcr.io/${{ env.OWNER }}/bubble-tea-staff
          docker build --no-cache ./client-staff -t ${STAFF_IMG}:latest -t ${STAFF_IMG}:${{ steps.tags.outputs.sha_tag }} -t ${STAFF_IMG}:${{ steps.tags.outputs.branch_tag }}
          docker push -a ${STAFF_IMG}

      - name: Summary
        run: |
          echo "## ✅ Docker Images Built & Pushed"
          echo ""
          echo "| Service | Image |"
          echo "|---------|-------|"
          echo "| API | \`ghcr.io/${{ env.OWNER }}/bubble-tea-api:latest\` |"
          echo "| Admin | \`ghcr.io/${{ env.OWNER }}/bubble-tea-admin:latest\` |"
          echo "| POS | \`ghcr.io/${{ env.OWNER }}/bubble-tea-pos:latest\` |"
          echo "| Staff | \`ghcr.io/${{ env.OWNER }}/bubble-tea-staff:latest\` |"
          echo ""
          echo "**服务器手动更新命令：**"
          echo '```bash'
          echo "# 登录 GHCR（只需一次）"
          echo 'echo $GITHUB_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin'
          echo ""
          echo "# 拉取最新镜像"
          echo "docker pull ghcr.io/${{ env.OWNER }}/bubble-tea-api:latest"
          echo "docker pull ghcr.io/${{ env.OWNER }}/bubble-tea-admin:latest"
          echo "docker pull ghcr.io/${{ env.OWNER }}/bubble-tea-pos:latest"
          echo "docker pull ghcr.io/${{ env.OWNER }}/bubble-tea-staff:latest"
          echo ""
          echo "# 重启容器"
          echo "docker-compose -f docker-compose.yml up -d"
          echo '```'
