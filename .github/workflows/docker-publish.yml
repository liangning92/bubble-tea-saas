name: Verify Docker Images (No Publish)

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - 'client-admin/**'
      - 'client-pos/**'
      - 'client-staff/**'
      - 'shared/**'
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            context: server
            dockerfile: server/Dockerfile
          - service: admin
            context: .
            dockerfile: client-admin/Dockerfile
          - service: pos
            context: .
            dockerfile: client-pos/Dockerfile
          - service: staff
            context: .
            dockerfile: client-staff/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and save exact image without registry authentication or publication
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${IMAGE_OWNER,,}/bubble-tea-${SERVICE}:sha-${SOURCE_SHA}"
          docker build -f "$DOCKERFILE" --label "org.opencontainers.image.revision=${SOURCE_SHA}" "$BUILD_CONTEXT" -t "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          mkdir -p verified-image
          docker save "$IMAGE" -o verified-image/image.tar
          IMAGE_ID=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          TAR_SHA=$(sha256sum verified-image/image.tar | cut -d' ' -f1)
          jq -n --arg sourceSha "$SOURCE_SHA" --arg service "$SERVICE" --arg imageId "$IMAGE_ID" --arg imageTarSha256 "$TAR_SHA" '{sourceSha:$sourceSha,service:$service,imageId:$imageId,imageTarSha256:$imageTarSha256}' > verified-image/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: docker-verified-${{ github.sha }}-${{ matrix.service }}
          path: verified-image/
          retention-days: 3
          compression-level: 1
