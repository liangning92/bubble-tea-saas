name: Verify Docker Images (No Publish)

on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: 'Full source SHA in the user-confirmed change list'
        type: string
        required: true
      confirmed:
        description: 'User has confirmed this exact SHA and component'
        type: boolean
        default: false
      base_sha:
        description: 'Full SHA of the confirmed comparison/release baseline (required for scoped checks)'
        type: string
        required: false
      component_baselines:
        description: 'Optional JSON of verified live api/admin/pos/staff full SHAs; checks use each service’s actual difference'
        type: string
        required: false
      full_regression:
        description: 'Explicitly run the entire historical regression suite'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  scope:
    if: inputs.confirmed == true && inputs.reviewed_sha == github.sha
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has_images: ${{ steps.select.outputs.has_images }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: select
        name: Select only affected image services
        env:
          COMPONENT_BASELINES: ${{ inputs.component_baselines }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ github.sha }}
          FULL_REGRESSION: ${{ inputs.full_regression }}
        run: node scripts/ci-scope.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: docker-scope-${{ github.sha }}
          path: ci-scope.json
          retention-days: 3
  verify:
    needs: scope
    if: inputs.confirmed == true && inputs.reviewed_sha == github.sha && needs.scope.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and save exact image without registry authentication or publication
        env:
          SOURCE_SHA: ${{ github.sha }}
          IMAGE_OWNER: ${{ github.repository_owner }}
          SERVICE: ${{ matrix.service }}
          BUILD_CONTEXT: ${{ matrix.context }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${IMAGE_OWNER,,}/bubble-tea-${SERVICE}:sha-${SOURCE_SHA}"
          docker build -f "$DOCKERFILE" --build-arg "SOURCE_SHA=${SOURCE_SHA}" --label "org.opencontainers.image.revision=${SOURCE_SHA}" "$BUILD_CONTEXT" -t "$IMAGE"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_SHA"
          mkdir -p verified-image
          docker save "$IMAGE" -o verified-image/image.tar
          IMAGE_ID=$(docker image inspect "$IMAGE" --format '{{.Id}}')
          TAR_SHA=$(sha256sum verified-image/image.tar | cut -d' ' -f1)
          jq -n --arg sourceSha "$SOURCE_SHA" --arg service "$SERVICE" --arg imageId "$IMAGE_ID" --arg imageTarSha256 "$TAR_SHA" '{sourceSha:$sourceSha,service:$service,imageId:$imageId,imageTarSha256:$imageTarSha256}' > verified-image/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: docker-verified-${{ github.sha }}-${{ matrix.service }}
          path: verified-image/
          retention-days: 3
          compression-level: 1
