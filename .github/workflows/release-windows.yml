name: Publish Verified Windows Installer

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Explicitly publish updater release after legacy compatibility clearance'
        type: boolean
        default: false
      source_sha:
        description: 'Full 40-character verified source SHA already in master history'
        required: true
      verification_run_id:
        description: 'Successful GitHub Windows verification run for that exact SHA'
        required: true

concurrency:
  group: publish-windows-${{ inputs.source_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  gate:
    if: inputs.publish == true && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      run_id: ${{ steps.source.outputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: source
        name: Require exact reviewed source and successful prior Windows verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ inputs.source_sha }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: node .github/scripts/check-release-source.cjs windows
      - uses: actions/download-artifact@v4
        with:
          name: BTPS-validation-evidence
          path: evidence/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ steps.source.outputs.run_id }}
      - name: Refuse before publication without legacy compatibility clearance
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node - <<'JS'
          const fs=require('fs'),assert=require('assert/strict');
          const manifest=JSON.parse(fs.readFileSync('evidence/desktop-template-manifest.json','utf8'));
          const compatibility=JSON.parse(fs.readFileSync('evidence/desktop-compatibility-report.json','utf8'));
          const guard=JSON.parse(fs.readFileSync('evidence/desktop-upgrade-gate-report.json','utf8'));
          const manual=JSON.parse(fs.readFileSync('evidence/desktop-manual-upgrade-report.json','utf8'));
          assert.equal(manual.sourceSha,process.env.RELEASE_SHA);
          assert.equal(manual.allCriticalCasesPassed,true);
          assert.equal(manual.installedVersion,manual.expectedVersion,'Installed runtime version must match the advertised build');
          assert.match(manual.installedVersion,/^\d+\.\d+\.\d+$/);
          assert.equal(manual.syntheticOnly,true);
          assert.equal(manual.onlineInteractiveInstallerVerified,true);
          assert.equal(manual.authentic295.originalVersion,'2026.10.295');
          assert.equal(manual.authentic295.originalPayloadUnmodified,true);
          assert.equal(manual.authentic295.originalUpdaterIpcUsed,true);
          assert.equal(manual.authentic295.downloadedCandidateHashMatched,true);
          assert.equal(manual.authentic295.historicalRowsPreserved,true);
          assert.equal(manual.authentic295.alternateProfilePreserved,true);
          assert.equal(manual.authentic295.restartedRuntime.version,manual.expectedVersion);
          assert.equal(manual.restartedRuntime.processStarted,true);
          assert.equal(manual.restartedRuntime.originalProfileUsed,true);
          assert.equal(manual.restartedRuntime.version,manual.expectedVersion);
          assert.deepEqual(manual.onlineInstallerArguments,['--updated','--force-run']);
          assert.equal(manual.cases.length,10);
          assert.ok(manual.cases.includes('interactive-nsis-obsolete-stage-preserved-new-installer-succeeds'));
          assert.equal(manual.downtimeLimitSeconds,90);
          assert.ok(Number.isFinite(manual.preparedDowntimeSeconds) && manual.preparedDowntimeSeconds > 0 && manual.preparedDowntimeSeconds <= 90);
          for (const [key,version] of [['authentic372','2026.10.372'],['authentic384','2026.10.384']]) {
            const run=manual[key];
            assert.equal(run.originalVersion,version);
            for (const field of ['originalPayloadUnmodified','originalUpdaterIpcUsed','downloadedCandidateHashMatched','historicalRowsPreserved','alternateProfilePreserved']) assert.equal(run[field],true);
            assert.equal(run.restartedRuntime.version,manual.expectedVersion);
            assert.equal(run.restartedRuntime.processStarted,true);
            assert.equal(run.restartedRuntime.originalProfileUsed,true);
          }
          assert.equal(manual.authentic372.originalInstallerSha256,'3943a394c848f869c8abc12e5706ce3e4bf2c18ff0412d708537ccfb8cd70acc');
          assert.equal(manual.authentic384.originalInstallerSha256,'3f52f8c7e19a0f497a53015e402a231adf675d4c2e63bec0d0aef899496810e6');
          assert.equal(manual.authentic372.obsoleteStagePreserved,true);
          assert.equal(manual.authentic384.backgroundBackupReused,true);
          assert.ok(Number.isFinite(manual.authentic384.downtimeSeconds) && manual.authentic384.downtimeSeconds > 0 && manual.authentic384.downtimeSeconds <= 90);
          assert.ok(manual.cases.includes('interactive-nsis-reuses-background-verified-backup'));
          assert.ok(manual.cases.includes('compiled-helper-historical-integer-leave-schema-preserved'));
          assert.ok(manual.cases.includes('generated-prisma-half-day-read-write-on-historical-integer-columns'));
          assert.deepEqual(manual.changes,JSON.parse(fs.readFileSync('docs/desktop-upgrade-changes.json','utf8')));
          assert.equal(manifest.existingDatabaseCompatible,true,'Legacy compatibility has not been cleared; no Release may be created');
          assert.equal(compatibility.newTemplateCompatible,true);
          assert.equal(guard.databaseBytesPreserved,true);
          assert.equal(guard.cases.length,3);
          assert.ok(guard.cases.every(row=>row.oldProcessPreserved&&row.installerExitCode===73));
          JS

      - name: Require the matching production backend before enabling installer updates
        env:
          RELEASE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          node - <<'JS'
          const assert=require('node:assert/strict');
          (async()=>{
            const response=await fetch('https://api.aicube.online/health',{signal:AbortSignal.timeout(8000)});
            assert.equal(response.status,200);
            const health=await response.json();
            assert.equal(health.status,'ok');
            assert.equal(health.sourceSha,process.env.RELEASE_SHA,'Deploy the matching backend first');
            assert.equal(health.capabilities.orderReceipt,1);
            assert.equal(health.capabilities.refundItems,2);
            assert.equal(health.capabilities.inventoryCount,3);
          })().catch(error=>{console.error(error);process.exitCode=1});
          JS

  publish:
    needs: gate
    if: inputs.publish == true && github.ref == 'refs/heads/master' && needs.gate.result == 'success'
    runs-on: windows-latest
    environment: windows-build
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: BTPS-build-dist
          path: release/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ needs.gate.outputs.run_id }}
      - name: Publish exact verified installer without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ needs.gate.outputs.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content 'release/latest.yml' -Raw
          if ($manifest -notmatch '(?m)^version: (\d+\.\d+\.\d+)\s*$') { throw 'Invalid verified version' }
          $version = $Matches[1]
          $exePath = "release/BTPS-$version-Windows-x64.exe"
          $blockmapPath = "$exePath.blockmap"
          foreach ($file in @($exePath, $blockmapPath)) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing verified artifact: $file" }
          }
          if (!$manifest.Contains("BTPS-$version-Windows-x64.exe")) { throw 'Installer/version mismatch' }
          $hash = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData([System.IO.File]::ReadAllBytes((Resolve-Path $exePath))))
          if (!$manifest.Contains($hash)) { throw 'Installer SHA512 mismatch' }
          $tag = "v$version"
          $env:RELEASE_TAG = $tag
          node .github/scripts/windows-release-tag.cjs ensure
          if ($LASTEXITCODE -ne 0) { throw 'Release tag SHA binding failed' }
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'Release already exists; do not overwrite another release' }
          node .github/scripts/windows-release-tag.cjs verify
          if ($LASTEXITCODE -ne 0) { throw 'Release tag moved before draft creation' }
          gh release create $tag --draft --target $env:RELEASE_SHA --title "BTPS $version" --notes "Verified installer from $($env:RELEASE_SHA)." --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Draft creation failed' }
          gh release upload $tag $exePath $blockmapPath 'release/latest.yml' --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Verified upload failed; draft remains unpublished' }
          node .github/scripts/windows-release-tag.cjs verify
          if ($LASTEXITCODE -ne 0) { throw 'Release tag moved; draft remains unpublished' }
          gh release edit $tag --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed' }
