name: Audit authentic 295 online upgrade
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audit dependencies
        run: npm ci --ignore-scripts
      - name: Download original published 315, verify digest and extract shipped helper
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release,build/upgrade-helper | Out-Null
          $exe='release/BTPS-2026.10.315-Windows-x64.exe'
          Invoke-WebRequest 'https://github.com/liangning92/bubble-tea-saas/releases/download/v2026.10.315/BTPS-2026.10.315-Windows-x64.exe' -OutFile $exe
          $expected='UN9JW80GwrOD4HHsw9vkmo5EeSUTlJEU8VD+K5ulqyctFkbgPMSA90IIAKwL2C6ObIJt3cVNbAMbWc8wXJuD5g=='
          $digest=[Convert]::ToBase64String([Security.Cryptography.SHA512]::HashData([IO.File]::ReadAllBytes((Resolve-Path $exe))))
          if($digest -ne $expected){throw 'Published 315 digest mismatch'}
          7z x $exe '-oartifact315' -y | Out-Null
          Copy-Item 'artifact315/$PLUGINSDIR/btps-db-upgrade.exe' 'build/upgrade-helper/'
          7z x 'artifact315/$PLUGINSDIR/app-64.7z' '-opayload315' -y | Out-Null
          Copy-Item 'payload315/resources/app.asar.unpacked/server/prisma/seed.db' 'server/prisma/seed.db' -Force
          node -e "const fs=require('fs');let p=JSON.parse(fs.readFileSync('package.json'));p.version='2026.10.315';fs.writeFileSync('package.json',JSON.stringify(p))"
          node scripts/prepare-desktop-template.cjs --output "$env:RUNNER_TEMP/audit-template" | Out-Null
          Copy-Item "$env:RUNNER_TEMP/audit-template/manifest.json" 'desktop-template-manifest.json'
      - name: Exercise shipped 315 helper and original 295 online updater
        run: python scripts/validate-windows-manual-upgrade.py
      - name: Capture runner diagnosis
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force diagnosis | Out-Null
          Get-ChildItem "$env:RUNNER_TEMP/btps-manual-owned-*" -Directory | ForEach-Object { Copy-Item "$($_.FullName)/original-295-runtime.log" diagnosis -ErrorAction SilentlyContinue }
          Copy-Item "$env:APPDATA/BTPS/logs/*" diagnosis -ErrorAction SilentlyContinue
          Copy-Item desktop-manual-upgrade-report.json diagnosis -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authentic-295-diagnosis
          path: diagnosis/
