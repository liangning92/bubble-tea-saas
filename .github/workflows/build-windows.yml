name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (空=自动日期, 例: 2024.07.14)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git URLs
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set version
        id: version
        run: |
          $year = Get-Date -Format 'yyyy'
          $month = [int](Get-Date -Format 'MM')
          $day = Get-Date -Format 'dd'
          $runNum = $env:GITHUB_RUN_NUMBER
          $version = "$year.$month.$runNum"
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          echo "VERSION_STR=$year.$month.$day.$runNum" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Update version in package files
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          (Get-Content package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content package.json
          (Get-Content client-pos/package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content client-pos/package.json

      - name: Install dependencies
        run: |
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          Get-ChildItem -Include package-lock.json -Recurse -Force | Remove-Item -Force -ErrorAction SilentlyContinue
          npm install --force --prefer-offline=false

      - name: Install server dependencies (populate server/node_modules/.bin/prisma)
        run: |
          Remove-Item -Force server/package-lock.json -ErrorAction SilentlyContinue
          Remove-Item -Force server/node_modules -Recurse -ErrorAction SilentlyContinue
          cd server
          npm install
          Set-Location ..

      - name: Generate Prisma client
        run: |
          cd server
          npx prisma generate
          Set-Location ..

      - name: Sync Prisma schema to database
        env:
          DATABASE_URL: "file:./seed.db"
        run: |
          $repoRoot = $PWD.Path
          Set-Location "$repoRoot\server\prisma"
          npx prisma db push --accept-data-loss



      - name: Build server
        run: npm run build:server

      - name: Build admin
        run: npm run build:admin

      - name: Build POS
        run: npm run build:pos

      - name: Compile Electron
        run: cd client-pos && npm run build:electron:main

      - name: Build Electron
        run: npx electron-builder --config "${{ github.workspace }}\electron-builder.json" --win --publish never

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Bubble Tea POS v${{ steps.version.outputs.VERSION }}
          draft: false
          files: |
            release/*.exe
            release/latest.yml
