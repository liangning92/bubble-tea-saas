name: Build Windows Executable

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (空=自动生成，例: 2026.10.293)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: windows-latest
    environment: windows-build
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git URLs
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          $year = Get-Date -Format 'yyyy'
          $month = [int](Get-Date -Format 'MM')
          $day = Get-Date -Format 'dd'
          $runNum = $env:GITHUB_RUN_NUMBER
          $version = "$year.$month.$runNum"
          $requestedVersion = $env:REQUESTED_VERSION
          if ($requestedVersion) {
            if ($requestedVersion -notmatch '^\d+\.\d+\.\d+$') { throw "Version must be major.minor.patch" }
            $version = $requestedVersion
          }
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          echo "VERSION_STR=$year.$month.$day.$runNum" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Update version in package files
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          (Get-Content package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content package.json
          (Get-Content client-pos/package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content client-pos/package.json

      - name: Install dependencies
        run: |
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          Get-ChildItem -Include package-lock.json -Recurse -Force | Remove-Item -Force -ErrorAction SilentlyContinue
          npm install --force --prefer-offline=false

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      - name: Install server dependencies
        run: |
          cd server
          npm install --prefer-offline=false
          Set-Location ..

      - name: Configure desktop SQLite database
        run: |
          $schemaPath = 'server/prisma/schema.prisma'
          $schema = Get-Content $schemaPath -Raw
          if ($schema -notmatch 'provider\s*=\s*"postgresql"') { throw "Expected PostgreSQL source schema" }
          $schema = $schema -replace 'provider\s*=\s*"postgresql"', 'provider = "sqlite"'
          Set-Content $schemaPath $schema -Encoding utf8

      - name: Generate Prisma client
        run: |
          cd server
          npx prisma generate
          Set-Location ..

      - name: Build server
        run: npm run build:server

      - name: Build admin
        run: npm run build:admin

      - name: Build POS
        run: npm run build:pos

      - name: Install POS dependencies
        run: |
          cd client-pos
          npm install --prefer-offline=false
          Set-Location ..

      - name: Ensure electron-pos-printer in node_modules
        run: |
          if (Test-Path "node_modules/electron-pos-printer") {
            if (!(Test-Path "client-pos/node_modules")) { New-Item -ItemType Directory -Force -Path "client-pos/node_modules" }
            Copy-Item -Path "node_modules/electron-pos-printer" -Destination "client-pos/node_modules/electron-pos-printer" -Recurse -Force
            Write-Host "Copied electron-pos-printer from root node_modules to client-pos/node_modules"
          }
          if (Test-Path "client-pos/node_modules/electron-pos-printer") {
            if (!(Test-Path "node_modules")) { New-Item -ItemType Directory -Force -Path "node_modules" }
            Copy-Item -Path "client-pos/node_modules/electron-pos-printer" -Destination "node_modules/electron-pos-printer" -Recurse -Force
            Write-Host "Copied electron-pos-printer from client-pos/node_modules to root node_modules"
          }

      - name: Compile Electron
        run: cd client-pos && npm run build:electron:main

      # 只打包，不上传
      - name: Build (no publish)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
        run: npx electron-builder --config "${{ github.workspace }}\electron-builder.json" --win --publish never

      - name: Smoke test packaged local API
        run: |
          $ErrorActionPreference = 'Stop'
          $appPath = (Resolve-Path 'release/win-unpacked/BTPS.exe').Path
          $resources = (Resolve-Path 'release/win-unpacked/resources/app.asar.unpacked').Path
          $dbPath = Join-Path $env:RUNNER_TEMP 'pos-smoke.db'
          Copy-Item (Join-Path $resources 'server/prisma/seed.db') $dbPath
          $env:ELECTRON_RUN_AS_NODE = '1'
          $env:NODE_ENV = 'production'
          $env:JWT_SECRET = [Convert]::ToHexString([System.Security.Cryptography.RandomNumberGenerator]::GetBytes(32))
          $env:DATABASE_URL = "file:$($dbPath.Replace('\', '/'))"
          $env:PORT = '17072'
          $env:CORS_ORIGIN = 'null,http://localhost:6063'
          $env:NODE_PATH = "$(Join-Path $resources 'server/node_modules');$(Join-Path $resources 'node_modules')"
          $entry = Join-Path $resources 'server/dist/index.js'
          $stdout = Join-Path $env:RUNNER_TEMP 'pos-api-smoke.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'pos-api-smoke-error.log'
          $api = Start-Process $appPath -ArgumentList "`"$entry`"" -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              Start-Sleep -Seconds 2
              if ($api.HasExited) { break }
              try {
                $health = Invoke-RestMethod 'http://127.0.0.1:17072/health' -TimeoutSec 2
                if ($health.status -eq 'ok') { $healthy = $true; break }
              } catch { }
            }
            if (!$healthy) {
              Get-Content $stdout, $stderr -ErrorAction SilentlyContinue
              throw 'Packaged POS API failed startup validation'
            }
            Write-Host 'Packaged POS API startup passed'
          } finally {
            if (!$api.HasExited) { Stop-Process -Id $api.Id -Force }
          }

      - name: List ASAR contents (debug)
        run: |
          $asar = Get-ChildItem -Path release -Filter "*.asar" -Recurse | Select-Object -First 1
          if ($asar) {
            npx asar list $asar.FullName | Select-String "electron-pos-printer"
          } else {
            Write-Host "No ASAR found"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BTPS-build-dist
          path: release/

  publish:
    needs: build
    runs-on: windows-latest
    environment: windows-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: BTPS-build-dist
          path: release/

      - name: Validate and publish complete update
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:RELEASE_VERSION
          $tag = "v$version"
          $exePath = "release/BTPS-$version-Windows-x64.exe"
          $blockmapPath = "$exePath.blockmap"
          $latestYml = "release/latest.yml"
          foreach ($file in @($exePath, $blockmapPath, $latestYml)) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -eq 0) { throw "Missing update artifact: $file" }
          }
          $manifest = Get-Content $latestYml -Raw
          if ($manifest -notmatch "(?m)^version: $([regex]::Escape($version))\s*$") { throw "Update version mismatch" }
          if (!$manifest.Contains("BTPS-$version-Windows-x64.exe")) { throw "Update installer mismatch" }
          $actualHash = [Convert]::ToBase64String([System.Security.Cryptography.SHA512]::HashData([System.IO.File]::ReadAllBytes((Resolve-Path $exePath))))
          if (!$manifest.Contains($actualHash)) { throw "Update installer checksum mismatch" }
          $existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (!(($existing | ConvertFrom-Json).isDraft)) { throw "Published release already exists: $tag" }
          } else {
            gh release create $tag --draft --target $env:RELEASE_SHA --title "BTPS $version" --notes "POS source repairs, product analysis and automatic update notifications." --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) { throw "Release creation failed" }
          }
          gh release upload $tag $exePath $blockmapPath $latestYml --clobber --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Update artifact upload failed" }
          gh release edit $tag --draft=false --latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Release publication failed" }
