name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (空=自动日期, 例: 2024.07.14)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git URLs
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set version
        id: version
        run: |
          $date = Get-Date -Format 'yyyy.MM.dd'
          $runNum = $env:GITHUB_RUN_NUMBER
          $version = "$date.$runNum"
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          echo "VERSION_STR=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Update package.json version
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          (Get-Content package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content package.json

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build server
        run: npm run build:server

      - name: Build admin
        run: npm run build:admin

      - name: Build POS
        run: npm run build:pos

      - name: Compile Electron
        run: npm run electron:compile

      - name: Build Windows executable
        run: npx electron-builder --config electron-builder.json --win --publish always

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Bubble Tea POS v${{ steps.version.outputs.VERSION }}
          draft: false
          files: |
            release/win-unpacked/**
            release/*.exe
