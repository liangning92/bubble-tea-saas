name: Build Windows Installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install --include=dev

      - name: Install POS dependencies
        run: |
          cd client-pos
          npm install --include=dev

      - name: TypeScript type check
        run: |
          cd client-pos
          npx tsc --noEmit

      - name: Build Vite frontend
        run: |
          cd client-pos
          npm run build

      - name: Build Electron main process
        run: |
          cd client-pos
          npm run build:electron:main

      - name: Electron smoke test
        run: |
          cd client-pos
          npx electron --version

      - name: Build portable exe (smoke test)
        run: |
          cd client-pos
          npx electron-builder --win portable --x64 --dir

      - name: Verify exe exists
        run: |
          if (Test-Path "client-pos/release/win-unpacked/BubbleTeaPOS.exe") {
            Write-Host "✓ Smoke test passed - exe exists"
            Get-Item "client-pos/release/win-unpacked/BubbleTeaPOS.exe" | Select-Object Name, Length
          } else {
            Write-Error "Smoke test failed - exe not found"
            exit 1
          }

      - name: Launch test
        run: |
          $exePath = "client-pos/release/win-unpacked/BubbleTeaPOS.exe"
          $appName = "BubbleTeaPOS"
          $wait = 8
          $port = 9222

          # Start Electron with remote debugging
          $errLog = "$env:TEMP\electron_err_$PID.log"
          $proc = Start-Process $exePath -ArgumentList "--disable-gpu","--no-sandbox","--remote-debugging-port=$port" -PassThru -RedirectStandardError $errLog
          Write-Host "Started process $($proc.Id), waiting ${wait}s..."
          Start-Sleep $wait

          # Check if still running
          if ($proc.HasExited) {
            Write-Error "App exited with code $($proc.ExitCode)"
            if (Test-Path $errLog) { Get-Content $errLog | Select-Object -First 10 }
            exit 1
          }

          # Check stderr for errors
          if ((Test-Path $errLog) -and (Get-Content $errLog -Raw) -match "Error|Exception|ERR_") {
            Write-Host "⚠ Stderr warnings:"
            Get-Content $errLog | Select-Object -First 5
          }

          # Verify chrome_debugger.json exists (proves renderer started)
          $debugPort = Test-Path "$env:TEMP\$appName*\ChromiumDevToolsPort*"
          Write-Host "✓ App is running (PID $($proc.Id))"

          # Cleanup
          Stop-Process $proc.Id -Force -ErrorAction SilentlyContinue
          Remove-Item $errLog -ErrorAction SilentlyContinue
          Write-Host "✓ Launch test passed"

  build:
    needs: test-windows
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --include=dev
          cd client-pos
          npm install --include=dev

      - name: Build POS Electron app
        run: |
          cd client-pos
          npm run build
          npm run build:electron:main

      - name: Build NSIS Installer
        run: |
          cd client-pos
          npx electron-builder --win nsis --x64

      - name: Get version from package.json
        id: version
        run: |
          $version = (Get-Content client-pos/package.json | ConvertFrom-Json).version
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "Building version: $version"

      - name: Create latest.yml with SHA512
        run: |
          $version = (Get-Content client-pos/package.json | ConvertFrom-Json).version
          $sha512 = (Get-FileHash client-pos/release/BubbleTeaPOS.exe -Algorithm SHA512).Hash.ToLower()
          $size = (Get-Item client-pos/release/BubbleTeaPOS.exe).Length
          $date = Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ"
          $content = @"
          version: $version
          sha512: $sha512
          releaseDate: '$date'
          files:
            - url: BubbleTeaPOS.exe
              sha512: $sha512
              size: $size
          path: BubbleTeaPOS.exe
          githubDownloadUrl: https://github.com/liangning92/bubble-tea-saas/releases/download/v$version/BubbleTeaPOS.exe
          "@
          $content | Out-File -FilePath client-pos/release/latest.yml -Encoding utf8
          echo "=== latest.yml content ==="
          Get-Content client-pos/release/latest.yml

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: client-pos/release/BubbleTeaPOS.exe
          retention-days: 7

      - name: Upload latest.yml
        uses: actions/upload-artifact@v4
        with:
          name: latest-yml
          path: client-pos/release/latest.yml
          retention-days: 7

      - name: Build Portable version
        run: |
          cd client-pos
          npx electron-builder --win portable --x64

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: client-pos/release/win-unpacked/
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-installer
          path: .

      - name: Download latest.yml
        uses: actions/download-artifact@v4
        with:
          name: latest-yml
          path: .

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "version:" latest.yml | sed 's/version: //' | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release for version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            BubbleTeaPOS.exe
            latest.yml
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: BubbleTeaPOS v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}