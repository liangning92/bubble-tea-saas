name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (空=自动日期, 例: 2024.07.14)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  build:
    runs-on: windows-latest
    environment: windows-build
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git URLs
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Set version
        id: version
        run: |
          $year = Get-Date -Format 'yyyy'
          $month = [int](Get-Date -Format 'MM')
          $day = Get-Date -Format 'dd'
          $runNum = $env:GITHUB_RUN_NUMBER
          $version = "$year.$month.$runNum"
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          echo "VERSION_STR=$year.$month.$day.$runNum" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Update version in package files
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          (Get-Content package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content package.json
          (Get-Content client-pos/package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content client-pos/package.json

      - name: Install dependencies
        run: |
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          Get-ChildItem -Include package-lock.json -Recurse -Force | Remove-Item -Force -ErrorAction SilentlyContinue
          npm install --force --prefer-offline=false

      - name: Rebuild native modules for Electron
        run: npx electron-rebuild

      - name: Install server dependencies
        run: |
          Remove-Item -Force server/package-lock.json -ErrorAction SilentlyContinue
          Remove-Item -Force server/node_modules -Recurse -ErrorAction SilentlyContinue
          cd server
          npm install
          Set-Location ..

      - name: Generate Prisma client
        run: |
          cd server
          npx prisma generate
          Set-Location ..

      - name: Build server
        run: npm run build:server

      - name: Build admin
        run: npm run build:admin

      - name: Build POS
        run: npm run build:pos

      - name: Install POS dependencies
        run: |
          Remove-Item -Force client-pos/package-lock.json -ErrorAction SilentlyContinue
          Remove-Item -Force client-pos/node_modules -Recurse -ErrorAction SilentlyContinue
          cd client-pos
          npm install
          Set-Location ..

      - name: Ensure electron-pos-printer in node_modules
        run: |
          if (Test-Path "node_modules/electron-pos-printer") {
            if (!(Test-Path "client-pos/node_modules")) { New-Item -ItemType Directory -Force -Path "client-pos/node_modules" }
            Copy-Item -Path "node_modules/electron-pos-printer" -Destination "client-pos/node_modules/electron-pos-printer" -Recurse -Force
            Write-Host "Copied electron-pos-printer from root node_modules to client-pos/node_modules"
          }
          if (Test-Path "client-pos/node_modules/electron-pos-printer") {
            if (!(Test-Path "node_modules")) { New-Item -ItemType Directory -Force -Path "node_modules" }
            Copy-Item -Path "client-pos/node_modules/electron-pos-printer" -Destination "node_modules/electron-pos-printer" -Recurse -Force
            Write-Host "Copied electron-pos-printer from client-pos/node_modules to root node_modules"
          }

      - name: Compile Electron
        run: cd client-pos && npm run build:electron:main

      # 只打包，不上传
      - name: Build (no publish)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: electron-builder
        run: npx electron-builder --config "${{ github.workspace }}\electron-builder.json" --win --publish never

      - name: List ASAR contents (debug)
        run: |
          $asar = Get-ChildItem -Path release -Filter "*.asar" -Recurse | Select-Object -First 1
          if ($asar) {
            npx asar list $asar.FullName | Select-String "electron-pos-printer"
          } else {
            Write-Host "No ASAR found"
          }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BTPS-build-dist
          path: release/

  publish:
    needs: build
    runs-on: windows-latest
    environment: windows-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: BTPS-build-dist
          path: release/

      - name: Download latest tag info
        id: latest_tag
        run: |
          $version = "${{ needs.build.outputs.version }}"
          echo "TAG=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $tag = "v$version"
          
          # Delete existing release for this tag if it exists
          $existing = gh release view "$tag" --repo "$env:GITHUB_REPOSITORY" 2>$null
          if ($existing) {
            Write-Host "Deleting existing release $tag"
            gh release delete "$tag" --yes --repo "$env:GITHUB_REPOSITORY" 2>$null
          }
          
          # Create release
          gh release create "$tag" `
            --title "BTPS $version" `
            --notes "BTPS Version $version" `
            --repo "$env:GITHUB_REPOSITORY"

      - name: Upload exe asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $exePath = "release/BTPS-$version-Windows-x64.exe"
          $tag = "v$version"
          
          Write-Host "Uploading $exePath to release $tag"
          gh release upload "$tag" "$exePath" `
            --repo "$env:GITHUB_REPOSITORY" `
            --clobber

      - name: Upload blockmap asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ needs.build.outputs.version }}"
          $blockmapPath = "release/BTPS-$version-Windows-x64.exe.blockmap"
          $tag = "v$version"
          
          Write-Host "Uploading $blockmapPath to release $tag"
          if (Test-Path "$blockmapPath") {
            gh release upload "$tag" "$blockmapPath" `
              --repo "$env:GITHUB_REPOSITORY" `
              --clobber
          }

      - name: Upload latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "v${{ needs.build.outputs.version }}"
          $latestYml = "release/latest.yml"
          
          Write-Host "Uploading $latestYml to release $tag"
          if (Test-Path "$latestYml") {
            gh release upload "$tag" "$latestYml" `
              --repo "$env:GITHUB_REPOSITORY" `
              --clobber
          }
