name: Build Windows Installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --include=dev
          cd client-pos
          npm install --include=dev

      - name: Build POS Electron app
        run: |
          cd client-pos
          npm run build
          npm run build:electron:main

      - name: Get version from package.json
        id: version
        run: |
          $version = (Get-Content client-pos/package.json | ConvertFrom-Json).version
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          echo "Building version: $version"

      - name: Create latest.yml manually
        run: |
          $version = (Get-Content client-pos/package.json | ConvertFrom-Json).version
          $sha = git rev-parse --short HEAD
          $date = Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ"
          $content = @"
          version: $version
          sha512: COMPUTED-LATER
          releaseDate: '$date'
          files:
            - url: BubbleTeaPOS.exe
              sha512: COMPUTED-LATER
              size: $(Get-Item client-pos/release/BubbleTeaPOS.exe).Length
          path: BubbleTeaPOS.exe
          githubDownloadUrl: https://github.com/liangning92/bubble-tea-saas/releases/download/v$version/BubbleTeaPOS.exe
          "@
          $content | Out-File -FilePath client-pos/release/latest.yml -Encoding utf8
          Get-Content client-pos/release/latest.yml

      - name: Build NSIS Installer
        run: |
          cd client-pos
          npx electron-builder --win nsis --x64

      - name: Update latest.yml with actual file info
        run: |
          $version = (Get-Content client-pos/package.json | ConvertFrom-Json).version
          $sha512 = (Get-FileHash client-pos/release/BubbleTeaPOS.exe -Algorithm SHA512).Hash.ToLower()
          $size = (Get-Item client-pos/release/BubbleTeaPOS.exe).Length
          $content = @"
          version: $version
          sha512: $sha512
          releaseDate: $(Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
          files:
            - url: BubbleTeaPOS.exe
              sha512: $sha512
              size: $size
          path: BubbleTeaPOS.exe
          githubDownloadUrl: https://github.com/liangning92/bubble-tea-saas/releases/download/v$version/BubbleTeaPOS.exe
          "@
          $content | Out-File -FilePath client-pos/release/latest.yml -Encoding utf8

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: client-pos/release/BubbleTeaPOS.exe
          retention-days: 7

      - name: Upload latest.yml
        uses: actions/upload-artifact@v4
        with:
          name: latest-yml
          path: client-pos/release/latest.yml
          retention-days: 7

      - name: Build Portable version
        run: |
          cd client-pos
          npx electron-builder --win portable --x64

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: client-pos/release/win-unpacked/
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-installer
          path: .

      - name: Download latest.yml
        uses: actions/download-artifact@v4
        with:
          name: latest-yml
          path: .

      - name: Get version
        id: version
        run: |
          VERSION=$(grep "version:" latest.yml | sed 's/version: //' | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Creating release for version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            BubbleTeaPOS.exe
            latest.yml
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: BubbleTeaPOS v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}