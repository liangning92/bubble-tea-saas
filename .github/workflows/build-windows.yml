name: Build Windows Installer

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          cd client-pos && npm install

      - name: Build POS Electron app
        run: |
          cd client-pos
          npm run build
          npm run build:electron:main
          npx electron-builder --win nsis --x64

      - name: Build Portable version
        run: |
          cd client-pos
          npx electron-builder --win portable --x64
        env:
          NODE_VERSION: '20'

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: client-pos/release/BubbleTeaPOS.exe
          retention-days: 14

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: client-pos/release/win-unpacked/
          retention-days: 14

      - name: Create Release Draft
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          files: |
            client-pos/release/BubbleTeaPOS.exe
            client-pos/release/win-unpacked/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}