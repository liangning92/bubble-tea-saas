name: Build Windows Installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install --include=dev
          npm install app-builder-lib@24.13.3 electron-builder@24.13.3

      - name: Build POS Electron app
        run: |
          cd client-pos
          npm run build
          npm run build:electron:main
          npx electron-builder --win nsis --x64

      - name: Build Portable version
        run: |
          cd client-pos
          npx electron-builder --win portable --x64

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: client-pos/release/BubbleTeaPOS.exe
          retention-days: 14

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: client-pos/release/win-unpacked/
          retention-days: 14

      # Note: Release creation removed - download artifacts from Actions tab manually
      # To enable: add GITHUB_TOKEN with repo scope and use softprops/action-gh-release