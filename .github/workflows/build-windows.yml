name: Build Windows Installer

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install --include=dev
          cd client-pos
          npm install --include=dev

      - name: Build POS Electron app
        run: |
          cd client-pos
          npm run build
          npm run build:electron:main
          npx electron-builder --win nsis --x64

      - name: Build Portable version
        run: |
          cd client-pos
          npx electron-builder --win portable --x64

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis-installer
          path: client-pos/release/BubbleTeaPOS.exe
          retention-days: 7

      - name: Upload Portable
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: client-pos/release/win-unpacked/
          retention-days: 7

      - name: Upload latest.yml
        uses: actions/upload-artifact@v4
        with:
          name: latest-yml
          path: client-pos/release/latest.yml
          retention-days: 7

  create-release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-nsis-installer
          path: .

      - name: Download latest.yml
        uses: actions/download-artifact@v4
        with:
          name: latest-yml
          path: .

      - name: Get version from latest.yml
        id: version
        run: |
          VERSION=$(grep "version:" latest.yml | sed 's/version: //')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Found version: $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            BubbleTeaPOS.exe
            latest.yml
          tag_name: v${{ steps.version.outputs.VERSION }}
          release_name: BubbleTeaPOS v${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}