name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (空=自动日期, 例: 2024.07.14)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix git URLs
        run: |
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set version
        id: version
        run: |
          $year = Get-Date -Format 'yyyy'
          $month = [int](Get-Date -Format 'MM')
          $day = Get-Date -Format 'dd'
          $runNum = $env:GITHUB_RUN_NUMBER
          # Use year.month.runNum format (3 segments for semver, no leading zeros)
          $version = "$year.$month.$runNum"
          echo "VERSION=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8
          echo "VERSION_STR=$year.$month.$day.$runNum" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Update package.json version
        run: |
          $version = "${{ steps.version.outputs.VERSION }}"
          (Get-Content package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content package.json
          (Get-Content client-pos/package.json) -replace '"version": "[^"]*"', "`"version`": `"$version`"" | Set-Content client-pos/package.json

      - name: Create git tag
        run: |
          git config --global user.name "CI Bot"
          git config --global user.email "ci@bubble-tea.local"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }}"
          git tag "v${{ steps.version.outputs.VERSION }}"
          git push origin master --tags

      - name: Install dependencies
        run: |
          Remove-Item -Force package-lock.json -ErrorAction SilentlyContinue
          Get-ChildItem -Include package-lock.json -Recurse -Force | Remove-Item -Force -ErrorAction SilentlyContinue
          npm install --force --prefer-offline=false

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build server
        run: npm run build:server

      - name: Build admin
        run: npm run build:admin

      - name: Build POS
        run: npm run build:pos

      - name: Compile Electron
        run: cd client-pos && npm run build:electron:main

      - name: Build Electron
        run: npx electron-builder --config "${{ github.workspace }}\client-pos\package.json" --win --publish never

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Bubble Tea POS v${{ steps.version.outputs.VERSION }}
          draft: false
          files: |
            release/*.exe
            release/latest.yml
