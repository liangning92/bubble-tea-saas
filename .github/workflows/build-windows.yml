name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., 1.0.0)'
        required: false
        default: '1.0.0'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build server
        run: yarn run build:server

      - name: Build admin
        run: yarn run build:admin

      - name: Build POS
        run: yarn run build:pos

      - name: Compile Electron
        run: yarn run electron:compile

      - name: Build Windows executable
        run: npx electron-builder --config electron-builder.json --win --publish never

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.event.inputs.version || '1.0.0' }}
          name: Bubble Tea POS v${{ github.event.inputs.version || '1.0.0' }}
          draft: false
          prerelease: false
          files: release/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset
        if: steps.create_release.outputs.id != ''
        run: |
          echo "Release created successfully"
          echo "Download URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/v${{ github.event.inputs.version || '1.0.0' }}"
