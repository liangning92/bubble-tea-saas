name: Build verified Android TV APK
on:
  workflow_dispatch:
    inputs:
      reviewed_sha:
        description: Exact source SHA
        required: true
      base_sha:
        description: Verified comparison baseline
        required: true
      verification_run_id:
        description: Successful ordinary CI run for this exact SHA
        required: true
      confirmed:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: tv-apk-${{ github.sha }}
  cancel-in-progress: false
jobs:
  verify-build:
    if: inputs.confirmed && inputs.reviewed_sha == github.sha
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate exact baseline and source
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$SOURCE_SHA"
      - name: Require completed ordinary CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          VERIFICATION_RUN_ID: ${{ inputs.verification_run_id }}
        run: node .github/scripts/check-tv-ci.cjs
      - run: npm ci --prefix server
      - run: npm ci
      - run: npm run db:generate
      - run: node tests/stoploss/tv-signage-integration.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/stoploss/tv-signage-page-check.cjs
      - run: node tests/stoploss/tv-signage-admin-page-check.cjs
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/wrapper-validation@v3
      - name: Build with persistent production signing
        env:
          TV_KEYSTORE_BASE64: ${{ secrets.TV_KEYSTORE_BASE64 }}
          TV_KEYSTORE_PASSWORD: ${{ secrets.TV_KEYSTORE_PASSWORD }}
          TV_KEY_ALIAS: ${{ secrets.TV_KEY_ALIAS }}
          TV_KEY_PASSWORD: ${{ secrets.TV_KEY_PASSWORD }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          test -n "$TV_KEYSTORE_BASE64"
          export TV_KEYSTORE_FILE="$RUNNER_TEMP/tv-release.jks"
          printf '%s' "$TV_KEYSTORE_BASE64" | base64 --decode > "$TV_KEYSTORE_FILE"
          chmod 600 "$TV_KEYSTORE_FILE"
          export TV_VERSION_CODE="$GITHUB_RUN_NUMBER"
          export TV_VERSION_NAME="2.0.$GITHUB_RUN_NUMBER"
          bash tv-android-app/build-apk.sh
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose tv-android-app/app/build/outputs/apk/release/app-release.apk
          mkdir verified-tv
          cp tv-android-app/app/build/outputs/apk/release/app-release.apk verified-tv/Store-TV.apk
          sha256sum verified-tv/Store-TV.apk > verified-tv/SHA256SUMS
          printf '{"sourceSha":"%s","versionCode":%s,"versionName":"%s"}\n' "$SOURCE_SHA" "$TV_VERSION_CODE" "$TV_VERSION_NAME" > verified-tv/manifest.json
          rm "$TV_KEYSTORE_FILE"
      - uses: actions/upload-artifact@v4
        with:
          name: tv-verified-${{ github.sha }}
          path: verified-tv/
      - name: Publish these verified bytes
        if: inputs.publish && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          TAG="tv-v2.0.$GITHUB_RUN_NUMBER"
          gh release create "$TAG" --latest=false verified-tv/Store-TV.apk verified-tv/SHA256SUMS verified-tv/manifest.json --target "$SOURCE_SHA" --title "Store TV 2.0.$GITHUB_RUN_NUMBER" --notes "Store-scoped pairing, product and activity display, verified offline media. Source: $SOURCE_SHA"
