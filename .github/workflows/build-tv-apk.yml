name: Build Android TV APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: 1.0.0，留空则自动生成)'
        required: false
        default: ''
  push:
    paths:
      - 'tv-android-app/**'
      - '.github/workflows/build-tv-apk.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Xiaomi TV APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Set Version
        id: set_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(date +'%Y.%m.%d').${GITHUB_RUN_NUMBER}"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building YOUME TV APK version: ${VERSION}"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK with Gradle
        run: |
          cd tv-android-app
          # 如果没有 gradlew 包装器，自动初始化 gradle wrapper 并编译
          if [ ! -f "./gradlew" ]; then
            gradle wrapper
            chmod +x ./gradlew
          fi
          ./gradlew assembleRelease --stacktrace

      - name: Locate Output APK
        id: locate_apk
        run: |
          APK_FILE=$(find tv-android-app/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "❌ 未找到构建成功的 APK 文件！"
            exit 1
          fi
          echo "找到 APK: $APK_FILE"
          cp "$APK_FILE" ./YOUME_TV_Signage.apk
          echo "APK_PATH=./YOUME_TV_Signage.apk" >> $GITHUB_ENV

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: YOUME-TV-Signage-APK
          path: ./YOUME_TV_Signage.apk
          retention-days: 14

      - name: Publish to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="tv-v${{ env.VERSION }}"
          echo "发布 Release: $TAG_NAME"

          # 检查 Release 是否已存在
          if gh release view "$TAG_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG_NAME 已存在，覆盖更新 APK..."
          else
            gh release create "$TAG_NAME" \
              --title "YOUME TV 大屏客户端 v${{ env.VERSION }}" \
              --notes "📺 **小米电视 / Android TV 商业大屏客户端**
- 100% 沉浸全屏，无边框、无顶部输入栏
- 开机通电自启、硬件常亮不休眠
- 离线持久化缓存，断网持续播放
- 6位 PIN 码免遥控器打字配对
- 遥控器 Menu 键支持自定义切换 SaaS 云端或私有服务器" \
              --repo "$GITHUB_REPOSITORY"
          fi

          gh release upload "$TAG_NAME" "./YOUME_TV_Signage.apk" --repo "$GITHUB_REPOSITORY" --clobber
          echo "✅ 成功上传 YOUME_TV_Signage.apk 至 GitHub Releases ($TAG_NAME)"
