name: Test Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g. 2026.8.207)'
        required: true
        default: '2026.8.207'

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    
    steps:
      - name: Download EXE via curl
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $version = "$env:VERSION"
          Write-Host "Downloading v${version}..."
          $url = "https://github.com/liangning92/bubble-tea-saas/releases/download/v${version}/BTPS-${version}-Windows-x64.exe"
          Write-Host "URL: $url"
          curl -L -o BTPS.exe $url 2>&1 | Out-Host
          $file = Get-Item BTPS.exe
          Write-Host "Downloaded: $($file.Length) bytes"

      - name: Check EXE file
        shell: pwsh
        run: |
          $exe = Get-Item BTPS.exe
          Write-Host "EXE Size: $($exe.Length) bytes"
          if ($exe.Length -lt 1000000) {
            Write-Host "WARNING: File is very small"
            Get-Content BTPS.exe | Select-Object -First 5
          }

      - name: Extract EXE
        shell: pwsh
        run: |
          7z x -o:app BTPS.exe -y 2>&1 | Out-Null
          Write-Host "Extracted:"
          Get-ChildItem app -Recurse -File | Select-Object FullName, Length | Format-Table -AutoSize

      - name: Find seed.db
        shell: pwsh
        run: |
          $dbs = Get-ChildItem . -Recurse -Filter "seed.db" -File -EA SilentlyContinue
          if ($dbs) {
            foreach ($db in $dbs) {
              Write-Host "Found: $($db.FullName) ($($db.Length) bytes)"
            }
          } else {
            Write-Host "No seed.db found"
          }

      - name: Check app.asar.unpacked
        shell: pwsh
        run: |
          $unpackedDirs = Get-ChildItem . -Recurse -Directory -Filter "*.unpacked" -EA SilentlyContinue
          foreach ($dir in $unpackedDirs) {
            Write-Host "Unpacked dir: $($dir.FullName)"
            Get-ChildItem $dir -Recurse -File | Select-Object FullName | Format-Table -AutoSize
          }

      - name: Test app launch (no-install, direct extraction)
        shell: pwsh
        run: |
          # Find the inner app folder from NSIS extraction
          $innerApp = Get-ChildItem . -Directory | Where-Object { $_.Name -match 'app' } | Select-Object -First 1
          if ($innerApp) {
            Write-Host "Inner app: $($innerApp.FullName)"
            $exes = Get-ChildItem $innerApp.FullName -Recurse -Filter "*.exe" -File | Select-Object FullName
            Write-Host "Found EXEs:"
            $exes | Format-Table
          } else {
            Write-Host "Could not find inner app directory"
            Get-ChildItem . -Directory | Format-Table
          }
