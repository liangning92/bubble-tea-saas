name: Test Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g. 2026.8.207)'
        required: true
        default: '2026.8.207'

jobs:
  extract-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Download EXE
        run: |
          VERSION="${{ inputs.version }}"
          echo "Downloading v${VERSION}..."
          curl -L -o BTPS.exe "https://github.com/liangning92/bubble-tea-saas/releases/download/v${VERSION}/BTPS-${VERSION}-Windows-x64.exe"
          ls -lh BTPS.exe
          file BTPS.exe

      - name: Extract NSIS installer
        run: |
          mkdir -p app
          7z x -oapp BTPS.exe -y | tail -5
          echo "=== Extracted contents ==="
          find app -type f | head -30

      - name: Find seed.db
        run: |
          echo "=== Searching for seed.db ==="
          find . -name "seed.db" -type f 2>/dev/null | while read f; do
            echo "Found: $f ($(du -h "$f" | cut -f1))"
          done
          
          echo ""
          echo "=== Checking asar.unpacked directories ==="
          find . -name "*.unpacked" -type d 2>/dev/null | head -10
          
          echo ""
          echo "=== Checking for HygieneTemplate in seed.db ==="
          find . -name "seed.db" -type f 2>/dev/null | while read f; do
            echo "--- $f ---"
            if command -v sqlite3 &>/dev/null; then
              sqlite3 "$f" "PRAGMA table_info(HygieneTemplate);" 2>/dev/null | grep -i execution || echo "No executionTimes column"
            else
              echo "(sqlite3 not available)"
            fi
          done

      - name: Verify asarUnpack fix
        run: |
          echo "=== Checking if seed.db is in asar.unpacked ==="
          if find . -path "*/app.asar.unpacked/*/seed.db" -type f 2>/dev/null | grep -q .; then
            echo "SUCCESS: seed.db found in app.asar.unpacked (asarUnpack fix working)"
            find . -path "*/app.asar.unpacked/*/seed.db" -type f -exec ls -lh {} \;
          else
            echo "FAIL: seed.db NOT in app.asar.unpacked"
            echo "This means asarUnpack fix is not working"
            find . -name "seed.db" -type f 2>/dev/null | while read f; do
              echo "seed.db is at: $f (not in asar.unpacked)"
            done
            exit 1
          fi

      - name: Verify seed.db has executionTimes
        run: |
          SEED_IN_UNPACKED=$(find . -path "*/app.asar.unpacked/*/seed.db" -type f 2>/dev/null | head -1)
          if [ -z "$SEED_IN_UNPACKED" ]; then
            echo "FAIL: No seed.db found in asar.unpacked"
            exit 1
          fi
          
          echo "Checking: $SEED_IN_UNPACKED"
          if command -v sqlite3 &>/dev/null; then
            RESULT=$(sqlite3 "$SEED_IN_UNPACKED" "PRAGMA table_info(HygieneTemplate);" 2>/dev/null | grep -i executionTimes)
            if [ -n "$RESULT" ]; then
              echo "SUCCESS: executionTimes column found in HygieneTemplate"
              echo "$RESULT"
            else
              echo "FAIL: executionTimes column NOT found in HygieneTemplate"
              echo "Current columns:"
              sqlite3 "$SEED_IN_UNPACKED" "PRAGMA table_info(HygieneTemplate);" 2>/dev/null
              exit 1
            fi
          else
            echo "sqlite3 not available, checking file size instead"
            ls -lh "$SEED_IN_UNPACKED"
            if [ $(stat -c%s "$SEED_IN_UNPACKED") -gt 1000 ]; then
              echo "seed.db has content ($(stat -c%s "$SEED_IN_UNPACKED") bytes)"
            fi
          fi
