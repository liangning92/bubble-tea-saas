name: Test Windows EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to test (e.g. 2026.8.207)'
        required: true
        default: '2026.8.207'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm install --force 2>&1 | tail -5

      - name: Install server dependencies
        run: |
          cd server && npm install 2>&1 | tail -5 && cd ..

      - name: Generate Prisma client
        run: npm run db:generate 2>&1 | tail -5

      - name: Sync Prisma schema
        env:
          DATABASE_URL: "file:./seed.db"
        run: |
          cd server/prisma
          npx prisma db push --accept-data-loss 2>&1 | tail -10
          cd ../..
          ls -la server/prisma/seed.db

      - name: Verify seed.db has executionTimes
        run: |
          echo "=== Checking HygieneTemplate columns ==="
          sqlite3 server/prisma/seed.db "PRAGMA table_info(HygieneTemplate);" | grep -i execution

      - name: Build Electron app
        run: |
          npm run build:electron 2>&1 | tail -20

      - name: Package with electron-builder
        run: |
          npx electron-builder --win --dir 2>&1 | tail -20
          ls -la dist/win-unpacked/*.exe 2>/dev/null || ls -la dist/ 2>/dev/null

      - name: Extract and verify asar contents
        run: |
          # Find the built exe
          EXE=$(find dist -name "*.exe" -type f | head -1)
          echo "Found EXE: $EXE"
          
          # Extract NSIS
          mkdir -p extracted
          7z x -oextracted "$EXE" -y | tail -5
          
          # Check asar
          echo "=== Checking asar ==="
          find extracted -name "*.asar" -type f | head -5
          
          # Check asar.unpacked
          echo "=== Checking asar.unpacked ==="
          find extracted -name "*.unpacked" -type d | head -5
          
          # Find seed.db
          echo "=== Checking for seed.db ==="
          find extracted -name "seed.db" -type f | while read f; do
            echo "Found: $f ($(du -h "$f" | cut -f1))"
          done
          
          echo "=== Verifying asarUnpack ==="
          if find extracted -path "*/app.asar.unpacked/*/seed.db" -type f 2>/dev/null | grep -q .; then
            echo "SUCCESS: seed.db is in asar.unpacked"
          else
            echo "FAIL: seed.db is NOT in asar.unpacked"
            echo "Only seed.db locations:"
            find extracted -name "seed.db" -type f 2>/dev/null
            exit 1
          fi

      - name: Verify executionTimes column in packaged seed.db
        run: |
          SEED=$(find . -path "*/app.asar.unpacked/*/seed.db" -type f 2>/dev/null | head -1)
          if [ -n "$SEED" ]; then
            echo "Checking: $SEED"
            sqlite3 "$SEED" "PRAGMA table_info(HygieneTemplate);" | grep -i execution
            echo "Full schema:"
            sqlite3 "$SEED" "PRAGMA table_info(HygieneTemplate);"
          else
            echo "seed.db not found"
            exit 1
          fi
