server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_backend http://bubble-tea-api:3000;

    # The media API accepts up to ten 50MiB files per batch. It enforces
    # the per-file 5MiB image limit after authentication and signature checks.
    # Keep multipart overhead within this proxy envelope, including /media/.
    location ~ ^/api/media/?$ {
        client_max_body_size 501m;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/upload/tvMusic {
        client_max_body_size 301m;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/upload/dualScreen {
        client_max_body_size 51m;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # HTML must always describe the assets from the current deployment. An
    # already-open tab can recover from a removed lazy chunk by fetching this
    # document again without a four-hour CDN/browser cache delay.
    location = /index.html {
        add_header Cache-Control "no-store, max-age=0, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # Never return the SPA HTML for a missing JS/CSS chunk. Browsers reject
    # HTML as a module, and a misleading 200 also hides the real deployment
    # mismatch from diagnostics.
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /tv {
        return 308 /tv/$is_args$args;
    }

    location /tv/ {
        proxy_pass $api_backend;
        proxy_set_header Host $host;
    }

    location /api/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /uploads/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /socket.io/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}
