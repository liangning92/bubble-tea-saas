<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>智能大屏电子水牌看板</title>
  <style>
    /* -------------------------------------------------------------
       1. 全局重置与 100% 满屏无黑边引擎 (Fluid Fullscreen Engine)
       ------------------------------------------------------------- */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background-color: #0b0c10;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
      cursor: none; /* 电视端隐藏鼠标光标 */
    }

    body.show-cursor {
      cursor: default;
    }

    /* 安全区域内边距容器 (防电视边缘过扫描) */
    #app-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: padding 0.3s ease;
    }

    /* -------------------------------------------------------------
       2. 风格主题定义 (Themes: Dark Gold / Creamy / Vivid)
       ------------------------------------------------------------- */
    /* 主题 1: 黑金现代国际风 (Dark Gold - 默认) */
    .theme-international_dark {
      background: radial-gradient(circle at top left, #1a1c23 0%, #0d0e12 100%);
      color: #f3f4f6;
    }
    .theme-international_dark .category-header {
      background: linear-gradient(90deg, rgba(217, 119, 6, 0.25) 0%, transparent 100%);
      border-left: 4px solid #f59e0b;
      color: #fbbf24;
    }
    .theme-international_dark .product-row {
      border-bottom: 1px dashed rgba(255, 255, 255, 0.08);
    }
    .theme-international_dark .price-tag {
      color: #f59e0b;
      font-weight: 800;
    }
    .theme-international_dark .marquee-bar {
      background: #111318;
      border-top: 1px solid rgba(245, 158, 11, 0.3);
      color: #fef3c7;
    }

    /* 主题 2: 温润奶油风 (Creamy Morandi) */
    .theme-creamy_morandi {
      background: #fdfbf7;
      color: #382d24;
    }
    .theme-creamy_morandi .category-header {
      background: #f4ede2;
      border-left: 4px solid #d97706;
      color: #8c4e09;
    }
    .theme-creamy_morandi .product-row {
      border-bottom: 1px dashed rgba(140, 78, 9, 0.15);
    }
    .theme-creamy_morandi .price-tag {
      color: #c2410c;
      font-weight: 800;
    }
    .theme-creamy_morandi .marquee-bar {
      background: #f4ede2;
      border-top: 1px solid rgba(217, 119, 6, 0.2);
      color: #7c2d12;
    }

    /* 主题 3: 多巴胺潮酷风 (Vivid Dynamic) */
    .theme-dynamic_vivid {
      background: radial-gradient(circle at center, #1e1035 0%, #090314 100%);
      color: #ffffff;
    }
    .theme-dynamic_vivid .category-header {
      background: linear-gradient(90deg, rgba(236, 72, 153, 0.3) 0%, transparent 100%);
      border-left: 4px solid #ec4899;
      color: #f472b6;
    }
    .theme-dynamic_vivid .product-row {
      border-bottom: 1px dashed rgba(236, 72, 153, 0.15);
    }
    .theme-dynamic_vivid .price-tag {
      color: #06b6d4;
      font-weight: 800;
    }
    .theme-dynamic_vivid .marquee-bar {
      background: #17072a;
      border-top: 1px solid #ec4899;
      color: #fbcfe8;
    }

    /* -------------------------------------------------------------
       3. 顶部 Header (Logo + 门店名 + 实时时间 + 促销横幅)
       ------------------------------------------------------------- */
    .header-bar {
      height: clamp(54px, 7vh, 80px);
      padding: 0 clamp(16px, 2.5vw, 36px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }

    .brand-section {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-logo {
      height: clamp(34px, 4.8vh, 56px);
      object-fit: contain;
    }

    .brand-title {
      font-size: clamp(18px, 2.4vmin, 30px);
      font-weight: 900;
      letter-spacing: 0.5px;
      line-height: 1.1;
    }

    .brand-sub {
      font-size: clamp(10px, 1.2vmin, 14px);
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .activity-banner {
      flex: 1;
      max-width: 600px;
      margin: 0 24px;
      padding: 6px 16px;
      border-radius: 9999px;
      background: linear-gradient(90deg, #dc2626 0%, #ea580c 100%);
      color: #ffffff;
      font-size: clamp(12px, 1.4vmin, 16px);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 12px rgba(220, 38, 38, 0.35);
      animation: pulse-glow 3s infinite;
      overflow: hidden;
      white-space: nowrap;
    }

    @keyframes pulse-glow {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }

    .time-section {
      font-family: monospace;
      font-size: clamp(15px, 1.8vmin, 24px);
      font-weight: 700;
      opacity: 0.9;
    }

    /* -------------------------------------------------------------
       4. 核心展示区域 (Main Content Area)
       ------------------------------------------------------------- */
    .main-body {
      flex: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      position: relative;
    }

    /* 布局 1: 横屏分屏 (左侧媒体海报 + 右侧价目表) */
    .layout-split_media_menu {
      flex-direction: row;
    }
    .layout-split_media_menu .media-container {
      width: 42%;
      height: 100%;
      position: relative;
      overflow: hidden;
      border-right: 1px solid rgba(255, 255, 255, 0.08);
    }
    .layout-split_media_menu .menu-container {
      width: 58%;
      height: 100%;
      padding: clamp(12px, 1.8vh, 24px) clamp(16px, 2vw, 32px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 布局 2: 横屏全景价目表 (全屏多栏弹性网格) */
    .layout-menu_full {
      flex-direction: column;
    }
    .layout-menu_full .menu-container {
      width: 100%;
      height: 100%;
      padding: clamp(12px, 2vh, 24px) clamp(20px, 3vw, 40px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 布局 3: 纯媒体轮播 (全屏海报/视频) */
    .layout-media_loop {
      flex-direction: row;
    }
    .layout-media_loop .media-container {
      width: 100%;
      height: 100%;
    }

    /* 布局 4: 竖屏促销 + 精选 (上部海报 + 下部菜单) */
    .layout-portrait_promo_menu {
      flex-direction: column;
    }
    .layout-portrait_promo_menu .media-container {
      width: 100%;
      height: 52%;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }
    .layout-portrait_promo_menu .menu-container {
      width: 100%;
      height: 48%;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 布局 5: 竖屏纯海报轮播 */
    .layout-portrait_media_loop {
      flex-direction: column;
    }
    .layout-portrait_media_loop .media-container {
      width: 100%;
      height: 100%;
    }

    /* -------------------------------------------------------------
       5. 媒体组件 (支持 Cover 满铺 与 Contain+毛玻璃氛围，原比锁定)
       ------------------------------------------------------------- */
    .media-container {
      position: relative;
      background: #000000;
      overflow: hidden;
    }

    .media-backdrop {
      position: absolute;
      inset: -20px;
      background-size: cover;
      background-position: center;
      filter: blur(28px) brightness(0.6);
      transform: scale(1.15);
      opacity: 0;
      transition: opacity 1s ease-in-out;
      z-index: 1;
    }
    .media-backdrop.active {
      opacity: 1;
    }

    .media-slide {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }
    .media-slide.active {
      opacity: 1;
    }

    .media-element {
      width: 100%;
      height: 100%;
      display: block;
    }

    .fit-cover .media-element {
      object-fit: cover;
      object-position: center;
    }

    .fit-contain_blur .media-element {
      object-fit: contain;
      object-position: center;
    }

    /* -------------------------------------------------------------
       6. 菜单列表弹性流式网格 (Fluid Multi-Column Grid)
       ------------------------------------------------------------- */
    .menu-grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: 1fr;
      grid-auto-columns: minmax(280px, 1fr);
      gap: clamp(16px, 2vw, 36px);
      flex: 1;
      height: 100%;
      overflow: hidden;
    }

    .category-column {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .category-header {
      padding: clamp(6px, 1vh, 12px) 14px;
      font-size: clamp(15px, 1.8vmin, 22px);
      font-weight: 800;
      border-radius: 6px;
      margin-bottom: clamp(6px, 1vh, 12px);
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    .products-list {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      overflow: hidden;
    }

    .product-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: clamp(4px, 0.7vh, 8px) 4px;
      transition: background 0.2s;
    }

    .product-info {
      flex: 1;
      min-width: 0;
      padding-right: 12px;
    }

    .product-name-row {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .product-name {
      font-size: clamp(14px, 1.6vmin, 20px);
      font-weight: 700;
      line-height: 1.2;
    }

    .badge-tag {
      font-size: clamp(9px, 1vmin, 12px);
      font-weight: 800;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      white-space: nowrap;
    }

    .badge-promo {
      background: #dc2626;
      color: #ffffff;
      animation: bounce-subtle 2s infinite;
    }
    .badge-hot { background: #ea580c; color: #ffffff; }
    .badge-new { background: #16a34a; color: #ffffff; }
    .badge-flagship { background: #f59e0b; color: #000000; }

    @keyframes bounce-subtle {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    .product-desc {
      font-size: clamp(10px, 1.1vmin, 13px);
      opacity: 0.55;
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-price-box {
      text-align: right;
      flex-shrink: 0;
    }

    .price-original {
      font-size: clamp(10px, 1.1vmin, 13px);
      text-decoration: line-through;
      opacity: 0.45;
      margin-right: 4px;
    }

    .price-tag {
      font-size: clamp(15px, 2vmin, 24px);
      letter-spacing: -0.5px;
    }

    /* -------------------------------------------------------------
       7. 底部跑马灯滚动字幕
       ------------------------------------------------------------- */
    .marquee-bar {
      height: clamp(34px, 4.2vh, 46px);
      display: flex;
      align-items: center;
      overflow: hidden;
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }

    .marquee-badge {
      padding: 0 16px;
      font-size: clamp(11px, 1.3vmin, 14px);
      font-weight: 800;
      height: 100%;
      display: flex;
      align-items: center;
      background: rgba(220, 38, 38, 0.9);
      color: #ffffff;
      flex-shrink: 0;
      z-index: 2;
    }

    .marquee-track {
      flex: 1;
      overflow: hidden;
      white-space: nowrap;
      position: relative;
    }

    .marquee-content {
      display: inline-block;
      padding-left: 100%;
      animation: marquee-run 25s linear infinite;
      font-size: clamp(12px, 1.4vmin, 16px);
      font-weight: 600;
    }

    @keyframes marquee-run {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-100%, 0, 0); }
    }

    /* -------------------------------------------------------------
       8. 📺 随机激活配对码专属全屏界面 (Activation View)
       ------------------------------------------------------------- */
    .activation-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #1b2030 0%, #08090e 100%);
      z-index: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #ffffff;
    }

    .activation-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      padding: clamp(24px, 5vh, 48px) clamp(24px, 5vw, 64px);
      text-align: center;
      max-width: 860px;
      width: 100%;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(20px);
      animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .activation-logo-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .activation-logo {
      height: 48px;
    }

    .activation-brand-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .activation-title {
      font-size: clamp(16px, 2.2vmin, 24px);
      font-weight: 700;
      color: #94a3b8;
      margin-top: 8px;
    }

    /* 6 位超大发光激活码展示盒 */
    .pin-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(8px, 1.5vw, 16px);
      margin: clamp(20px, 4vh, 40px) 0;
    }

    .pin-digit {
      width: clamp(52px, 8vmin, 86px);
      height: clamp(66px, 11vmin, 108px);
      background: #141824;
      border: 2px solid #3b82f6;
      border-radius: 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: clamp(34px, 5.5vmin, 62px);
      font-weight: 900;
      color: #60a5fa;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 30px rgba(59, 130, 246, 0.25);
      text-shadow: 0 0 15px rgba(96, 165, 250, 0.5);
      transition: all 0.3s;
    }

    .pin-box.paired .pin-digit {
      border-color: #10b981;
      color: #34d399;
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.35);
      text-shadow: 0 0 15px rgba(52, 211, 153, 0.5);
    }

    .pin-divider {
      width: clamp(10px, 1.5vw, 18px);
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
    }

    /* 步骤流程图解 */
    .activation-instructions {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: rgba(255, 255, 255, 0.04);
      padding: 16px 24px;
      border-radius: 18px;
      margin-bottom: 24px;
      text-align: left;
    }

    .instruction-step {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .step-num {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #dc2626;
      color: white;
      font-size: 13px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .step-text {
      font-size: clamp(12px, 1.4vmin, 15px);
      color: #cbd5e1;
      line-height: 1.3;
    }

    .step-text b {
      color: #ffffff;
    }

    .instruction-arrow {
      color: #64748b;
      font-size: 16px;
    }

    .activation-status {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: clamp(13px, 1.5vmin, 16px);
      color: #38bdf8;
      font-weight: 600;
    }

    .status-pulse {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 12px #38bdf8;
      animation: pulse-dot 1.5s infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { opacity: 0.4; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.3); }
    }

    .activation-footer {
      margin-top: 24px;
      font-size: 12px;
      color: #64748b;
    }

    /* -------------------------------------------------------------
       9. 离线/异常标识与设置浮层 (Kiosk Drawer)
       ------------------------------------------------------------- */
    .offline-indicator {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(239, 68, 68, 0.85);
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 9999px;
      z-index: 100;
      display: none;
    }
    .offline-indicator.active {
      display: block;
    }

    .setup-trigger {
      position: absolute;
      top: 0;
      right: 0;
      width: 60px;
      height: 60px;
      z-index: 90;
      opacity: 0;
    }

    .setup-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 999;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .setup-modal.active {
      display: flex;
    }
    .setup-card {
      background: #1e2029;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 20px;
      padding: 30px;
      max-width: 460px;
      width: 100%;
      color: #fff;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
    }
    .setup-card input, .setup-card select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #444;
      background: #2a2d39;
      color: #fff;
      font-size: 16px;
      outline: none;
    }
    .setup-card button {
      width: 100%;
      padding: 14px;
      background: #dc2626;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body class="theme-international_dark">
  <!-- 📺 随机激活配对码大屏界面 (当电视未绑定时自动显示) -->
  <div id="activation-screen" class="activation-screen" style="display: none;">
    <div class="activation-card">
      <div class="activation-logo-box">
        <img id="activation-logo" src="" alt="Logo" class="activation-logo" style="display: none;" onerror="this.style.display='none'">
        <div id="activation-brand-title" class="activation-brand-title">电视大屏激活配对</div>
      </div>

      <div class="activation-title">电视大屏尚未配对，请在后台输入下方 6 位激活码</div>

      <!-- 6 位超大发光激活码 -->
      <div id="activation-pin-box" class="pin-box">
        <div class="pin-digit" id="d1">-</div>
        <div class="pin-digit" id="d2">-</div>
        <div class="pin-digit" id="d3">-</div>
        <div class="pin-divider"></div>
        <div class="pin-digit" id="d4">-</div>
        <div class="pin-digit" id="d5">-</div>
        <div class="pin-digit" id="d6">-</div>
      </div>

      <!-- 步骤流程指引 -->
      <div class="activation-instructions">
        <div class="instruction-step">
          <div class="step-num">1</div>
          <div class="step-text">打开 <b>POS 管理后台</b></div>
        </div>
        <div class="instruction-arrow">➔</div>
        <div class="instruction-step">
          <div class="step-num">2</div>
          <div class="step-text">进入 <b>「电视大屏」</b></div>
        </div>
        <div class="instruction-arrow">➔</div>
        <div class="instruction-step">
          <div class="step-num">3</div>
          <div class="step-text">点击 <b>「输入激活码配对新电视」</b> 并输入上方数字</div>
        </div>
      </div>

      <div class="activation-status">
        <span class="status-pulse"></span>
        <span id="activation-status-text">正在等待后台输入激活码配对中...</span>
      </div>

      <div class="activation-footer" style="display: flex; justify-content: space-between; align-items: center; margin-top: 24px;">
        <span>配对成功后将自动进入满屏播放，无需遥控器操作</span>
        <button id="activation-settings-btn" style="background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); color: #cbd5e1; border-radius: 8px; padding: 6px 14px; font-size: 12px; cursor: pointer;">⚙️ 更改服务器地址</button>
      </div>
    </div>
  </div>

  <!-- 主大屏展示容器 -->
  <div id="app-container">
    <!-- 顶部标题栏 -->
    <header class="header-bar">
      <div class="brand-section">
        <img id="brand-logo" src="" alt="Brand Logo" class="brand-logo" style="display: none;" onerror="this.style.display='none'">
        <div>
          <div id="brand-title" class="brand-title"></div>
          <div id="brand-sub" class="brand-sub"></div>
        </div>
      </div>

      <!-- 活动横幅 (若激活) -->
      <div id="activity-banner" class="activity-banner" style="display: none;">
        <span>🔥 今日特惠:</span>
        <span id="activity-banner-text">全场满减中</span>
      </div>

      <!-- 实时时间 -->
      <div id="clock-display" class="time-section">12:00</div>
    </header>

    <!-- 主展示区 -->
    <main id="main-body" class="main-body layout-split_media_menu">
      <!-- 媒体轮播区 -->
      <section id="media-section" class="media-container fit-cover">
        <div id="media-backdrop" class="media-backdrop"></div>
        <div id="media-slides-container"></div>
      </section>

      <!-- 菜单价目表区 -->
      <section id="menu-section" class="menu-container">
        <div id="menu-grid" class="menu-grid"></div>
      </section>
    </main>

    <!-- 底部跑马灯 -->
    <footer id="marquee-bar" class="marquee-bar" style="display: none;">
      <div class="marquee-badge">📢 公告</div>
      <div class="marquee-track">
        <span id="marquee-text" class="marquee-content"></span>
      </div>
    </footer>

    <!-- 离线状态提示 -->
    <div id="offline-badge" class="offline-indicator">⚠️ 离线播放模式</div>

    <!-- 双击/遥控器触发设置区域 -->
    <div class="setup-trigger" id="setup-trigger"></div>
  </div>

  <!-- 屏幕代号绑定弹窗 -->
  <div id="setup-modal" class="setup-modal">
    <div class="setup-card">
      <h2 style="font-size: 20px; font-weight: bold; margin-bottom: 8px;">📺 电视大屏连接与终端设置</h2>
      <p style="font-size: 13px; color: #9ca3af; margin-bottom: 16px;">
        支持自定 SaaS 云端服务器地址，并为本台电视指定屏幕代号。
      </p>

      <label style="font-size: 13px; font-weight: bold;">后台服务器地址 (SaaS云端或私有服务器):</label>
      <div style="display: flex; gap: 8px; margin-top: 6px; margin-bottom: 6px;">
        <input type="text" id="server-url-input" placeholder="例如 https://api.yourcloud.com" style="margin-top: 0; margin-bottom: 0; flex: 1;">
        <button id="test-server-btn" style="width: auto; padding: 10px 16px; background: #2563eb; font-size: 13px; border-radius: 10px; cursor: pointer;">测试连接</button>
      </div>
      <div id="test-server-feedback" style="font-size: 12px; min-height: 18px; margin-bottom: 14px; color: #94a3b8;"></div>

      <label style="font-size: 13px; font-weight: bold;">绑定的屏幕代号 (留空自动使用激活码配对):</label>
      <input type="text" id="screen-code-input" placeholder="输入屏幕代号 (例如 TV-01)" style="text-transform: uppercase;">

      <button id="save-setup-btn">保存并刷新大屏</button>
      <button id="unpair-btn" style="background: #374151; color: #f87171; margin-top: 10px; padding: 12px;">⚠️ 解除绑定 / 重新生成激活码</button>
      <button id="close-setup-btn" style="background: transparent; color: #9ca3af; margin-top: 8px; padding: 6px;">取消关闭</button>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 大屏前端核心逻辑 (Random PIN Pairing, Auto-Pull, Fluid Fit)
    // -------------------------------------------------------------
    const STORAGE_KEY_CODE = 'youme_tv_screen_code';
    const STORAGE_KEY_SERVER = 'youme_tv_server_url';
    const CACHE_KEY_DATA = 'youme_tv_cached_data_';

    const urlParams = new URLSearchParams(window.location.search);
    let explicitCode = urlParams.get('code');
    let storedCode = localStorage.getItem(STORAGE_KEY_CODE);
    let screenCode = explicitCode || storedCode || null;
    let serverBase = localStorage.getItem(STORAGE_KEY_SERVER) || window.location.origin;

    // 状态
    let currentData = null;
    let mediaSlides = [];
    let currentSlideIndex = 0;
    let slideTimer = null;
    let pollTimer = null;
    let pairPollTimer = null;
    let currentPairPin = null;
    let lastTimestamp = 0;

    // 初始化时钟
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      document.getElementById('clock-display').textContent = `${h}:${m}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    function formatPrice(num) {
      if (!num && num !== 0) return '';
      if (num >= 1000) return Math.round(num / 1000) + 'k';
      return num + '';
    }

    // -------------------------------------------------------------
    // 激活配对流程 (Activation Pairing Flow)
    // -------------------------------------------------------------
    async function initPairingMode() {
      // 显示激活界面，隐藏主展示区
      document.getElementById('activation-screen').style.display = 'flex';
      document.getElementById('app-container').style.display = 'none';

      try {
        const res = await fetch(`${serverBase}/api/tv/pair/request`, { method: 'POST' });
        const json = await res.json();
        if (json.success && json.data?.pin) {
          currentPairPin = json.data.pin;
          renderPinDigits(currentPairPin);

          // 动态显示门店信息
          if (json.data.store) {
            if (json.data.store.name) {
              document.title = `${json.data.store.name} 电视大屏激活配对`;
              document.getElementById('activation-brand-title').textContent = `${json.data.store.name} 电视大屏激活配对`;
            }
            const actLogo = document.getElementById('activation-logo');
            if (json.data.store.logo) {
              actLogo.src = json.data.store.logo;
              actLogo.style.display = 'block';
            } else {
              actLogo.style.display = 'none';
            }
          }

          startPairStatusCheck(currentPairPin);
        }
      } catch (err) {
        console.warn('请求生成激活码失败，重试中:', err);
        setTimeout(initPairingMode, 3000);
      }
    }

    function renderPinDigits(pinStr) {
      const pin = String(pinStr).padStart(6, '0');
      for (let i = 1; i <= 6; i++) {
        const el = document.getElementById(`d${i}`);
        if (el) el.textContent = pin[i - 1] || '-';
      }
    }

    function startPairStatusCheck(pin) {
      if (pairPollTimer) clearInterval(pairPollTimer);

      pairPollTimer = setInterval(async () => {
        try {
          const res = await fetch(`${serverBase}/api/tv/pair/check/${pin}`);
          const json = await res.json();

          if (json.success && json.data) {
            if (json.data.paired && json.data.screenCode) {
              clearInterval(pairPollTimer);
              onPairSuccess(json.data.screenCode);
            } else if (json.data.expired) {
              // 过期自动重新生成
              clearInterval(pairPollTimer);
              initPairingMode();
            }
          }
        } catch (err) {
          console.warn('轮询配对状态中:', err);
        }
      }, 2000);
    }

    function onPairSuccess(newCode) {
      // 成功配对动画
      document.getElementById('activation-pin-box').classList.add('paired');
      document.getElementById('activation-status-text').textContent = `🎉 配对成功！正在载入 [${newCode}] 大屏内容...`;
      document.getElementById('activation-status-text').style.color = '#34d399';

      screenCode = newCode;
      localStorage.setItem(STORAGE_KEY_CODE, screenCode);

      setTimeout(() => {
        document.getElementById('activation-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        startPolling();
      }, 1500);
    }

    // -------------------------------------------------------------
    // 大屏内容渲染
    // -------------------------------------------------------------
    function renderMediaCarousel(mediaItems, fitMode, intervalSec) {
      const slidesContainer = document.getElementById('media-slides-container');
      const backdrop = document.getElementById('media-backdrop');
      const section = document.getElementById('media-section');

      section.className = `media-container fit-${fitMode || 'cover'}`;
      if (slideTimer) clearInterval(slideTimer);
      slidesContainer.innerHTML = '';
      mediaSlides = [];

      if (!mediaItems || mediaItems.length === 0) {
        const slide = document.createElement('div');
        slide.className = 'media-slide active';
        const storeLogo = currentData?.store?.logo;
        const storeName = currentData?.store?.name || '';
        if (storeLogo) {
          slide.innerHTML = `<img src="${storeLogo}" class="media-element" style="object-fit: contain; max-width: 60%; max-height: 60%; margin: auto;" onerror="this.style.display='none'" />`;
        } else {
          slide.innerHTML = `<div style="display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; opacity:0.6; color:#cbd5e1;"><div style="font-size:32px; font-weight:800; margin-bottom:8px;">${storeName}</div><div style="font-size:15px;">可在后台为本屏幕挑选海报或视频</div></div>`;
        }
        slidesContainer.appendChild(slide);
        return;
      }

      mediaItems.forEach((item, index) => {
        const slide = document.createElement('div');
        slide.className = `media-slide ${index === 0 ? 'active' : ''}`;
        if (item.type === 'video') {
          slide.innerHTML = `<video src="${item.url}" class="media-element" autoplay loop muted playsinline></video>`;
        } else {
          slide.innerHTML = `<img src="${item.url}" alt="${item.name}" class="media-element" />`;
        }
        slidesContainer.appendChild(slide);
        mediaSlides.push({ element: slide, url: item.url, type: item.type });
      });

      if (fitMode === 'contain_blur' && mediaSlides.length > 0 && mediaSlides[0].type !== 'video') {
        backdrop.style.backgroundImage = `url('${mediaSlides[0].url}')`;
        backdrop.classList.add('active');
      } else {
        backdrop.classList.remove('active');
      }

      if (mediaSlides.length > 1) {
        currentSlideIndex = 0;
        const intervalMs = Math.max(3, intervalSec || 8) * 1000;
        slideTimer = setInterval(() => {
          mediaSlides[currentSlideIndex].element.classList.remove('active');
          currentSlideIndex = (currentSlideIndex + 1) % mediaSlides.length;
          const next = mediaSlides[currentSlideIndex];
          next.element.classList.add('active');

          if (fitMode === 'contain_blur') {
            if (next.type !== 'video') {
              backdrop.style.backgroundImage = `url('${next.url}')`;
              backdrop.classList.add('active');
            } else {
              backdrop.classList.remove('active');
            }
          }
        }, intervalMs);
      }
    }

    function renderMenuGrid(menuGroups) {
      const grid = document.getElementById('menu-grid');
      grid.innerHTML = '';

      if (!menuGroups || menuGroups.length === 0) {
        grid.innerHTML = '<div style="opacity: 0.5; padding: 20px;">暂无分类商品</div>';
        return;
      }

      menuGroups.forEach(group => {
        const col = document.createElement('div');
        col.className = 'category-column';

        const header = document.createElement('div');
        header.className = 'category-header';
        header.textContent = group.name;
        col.appendChild(header);

        const list = document.createElement('div');
        list.className = 'products-list';

        group.products.forEach(p => {
          const row = document.createElement('div');
          row.className = 'product-row';

          let badgeHtml = '';
          if (p.activityBadge) {
            badgeHtml = `<span class="badge-tag badge-promo">${p.activityBadge}</span>`;
          } else if (p.tags && p.tags.length > 0) {
            const firstTag = p.tags[0];
            const tagClass = firstTag.toUpperCase() === 'HOT' ? 'badge-hot' :
                             firstTag.toUpperCase() === 'NEW' ? 'badge-new' : 'badge-flagship';
            badgeHtml = `<span class="badge-tag ${tagClass}">${firstTag}</span>`;
          }

          let priceHtml = '';
          if (p.originalPrice && p.originalPrice > p.displayPrice) {
            priceHtml = `
              <span class="price-original">${formatPrice(p.originalPrice)}</span>
              <span class="price-tag" style="color: #dc2626;">${formatPrice(p.displayPrice)}</span>
            `;
          } else {
            priceHtml = `<span class="price-tag">${formatPrice(p.displayPrice || p.basePrice)}</span>`;
          }

          row.innerHTML = `
            <div class="product-info">
              <div class="product-name-row">
                <span class="product-name">${p.name}</span>
                ${badgeHtml}
              </div>
              ${p.description ? `<div class="product-desc">${p.description}</div>` : ''}
            </div>
            <div class="product-price-box">
              ${priceHtml}
            </div>
          `;
          list.appendChild(row);
        });

        col.appendChild(list);
        grid.appendChild(col);
      });
    }

    function applyScreenData(data) {
      if (!data || !data.screen) return;
      currentData = data;
      const { screen, mediaItems, menu, promotions, store } = data;

      // 动态更新门店品牌名称与副标题
      if (store) {
        if (store.name) {
          document.title = `${store.name} 电视大屏看板`;
          document.getElementById('brand-title').textContent = store.name;
        }
        document.getElementById('brand-sub').textContent = store.slogan || '';
        const logoEl = document.getElementById('brand-logo');
        if (store.logo) {
          logoEl.src = store.logo;
          logoEl.style.display = 'block';
        } else {
          logoEl.style.display = 'none';
        }
      }

      document.body.className = `theme-${screen.themeStyle || 'international_dark'}`;
      const safePad = screen.safeAreaPadding !== undefined ? screen.safeAreaPadding : 1.5;
      document.getElementById('app-container').style.padding = `${safePad}vmin`;

      const mainBody = document.getElementById('main-body');
      mainBody.className = `main-body layout-${screen.layoutTemplate || 'split_media_menu'}`;

      const bannerEl = document.getElementById('activity-banner');
      const bannerTextEl = document.getElementById('activity-banner-text');
      if (screen.showActivities && promotions && promotions.length > 0 && screen.activityDisplayType !== 'badges_only') {
        const promo = promotions[0];
        bannerTextEl.textContent = `${promo.badge ? `[${promo.badge}] ` : ''}${promo.description || promo.title}`;
        bannerEl.style.display = 'flex';
      } else {
        bannerEl.style.display = 'none';
      }

      renderMediaCarousel(mediaItems, screen.mediaFitMode, screen.mediaIntervalSeconds);
      renderMenuGrid(menu);

      let marqueeText = screen.marqueeText;
      if (!marqueeText && screen.showActivities && promotions && promotions.length > 0) {
        marqueeText = promotions.map(p => `🔥 ${p.title}: ${p.description}`).join('   |   ');
      }
      if (marqueeText) {
        document.getElementById('marquee-text').textContent = marqueeText;
        document.getElementById('marquee-bar').style.display = 'flex';
      } else {
        document.getElementById('marquee-bar').style.display = 'none';
      }
    }

    async function fetchScreenData() {
      if (!screenCode) return;
      const url = `${serverBase}/api/tv/display/${encodeURIComponent(screenCode)}`;
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();

        if (json.success && json.data) {
          document.getElementById('offline-badge').classList.remove('active');
          localStorage.setItem(CACHE_KEY_DATA + screenCode, JSON.stringify(json.data));

          if (json.data.timestamp !== lastTimestamp) {
            lastTimestamp = json.data.timestamp;
            applyScreenData(json.data);
          }
        }
      } catch (err) {
        console.warn('拉取大屏数据失败，使用离线缓存:', err);
        document.getElementById('offline-badge').classList.add('active');

        const cachedStr = localStorage.getItem(CACHE_KEY_DATA + screenCode);
        if (cachedStr) {
          try {
            applyScreenData(JSON.parse(cachedStr));
          } catch (e) {}
        }
      }
    }

    function startPolling() {
      if (pollTimer) clearInterval(pollTimer);
      fetchScreenData();
      sendHeartbeat();
      pollTimer = setInterval(() => {
        fetchScreenData();
        sendHeartbeat();
      }, 8000);
    }

    // -------------------------------------------------------------
    // 终端心跳与健康状态上报 (POS 同款云端连接监测)
    // -------------------------------------------------------------
    async function sendHeartbeat() {
      if (!screenCode) return;
      try {
        await fetch(`${serverBase}/api/tv/screens/${encodeURIComponent(screenCode)}/heartbeat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            resolution: `${window.innerWidth}x${window.innerHeight}`,
            orientation: window.innerWidth >= window.innerHeight ? 'landscape' : 'portrait',
            isOnline: navigator.onLine,
            appVersion: '1.0.0',
            userAgent: navigator.userAgent
          })
        });
      } catch (e) {
        // 心跳静默重试
      }
    }

    // 网络在线/离线自适应监听
    window.addEventListener('online', () => {
      document.getElementById('offline-badge').classList.remove('active');
      fetchScreenData();
      sendHeartbeat();
    });

    window.addEventListener('offline', () => {
      document.getElementById('offline-badge').classList.add('active');
    });

    // -------------------------------------------------------------
    // 设置抽屉与遥控器交互
    // -------------------------------------------------------------
    const setupModal = document.getElementById('setup-modal');
    const trigger = document.getElementById('setup-trigger');
    const codeInput = document.getElementById('screen-code-input');
    const serverInput = document.getElementById('server-url-input');
    const testServerBtn = document.getElementById('test-server-btn');
    const testFeedback = document.getElementById('test-server-feedback');
    const actSettingsBtn = document.getElementById('activation-settings-btn');

    function openSetup() {
      codeInput.value = screenCode || '';
      serverInput.value = serverBase;
      if (testFeedback) testFeedback.textContent = '';
      setupModal.classList.add('active');
      document.body.classList.add('show-cursor');
    }

    function closeSetup() {
      setupModal.classList.remove('active');
      document.body.classList.remove('show-cursor');
    }

    if (actSettingsBtn) {
      actSettingsBtn.addEventListener('click', openSetup);
    }

    trigger.addEventListener('dblclick', openSetup);

    window.addEventListener('keydown', (e) => {
      if (e.keyCode === 82 || e.key === 'm' || e.key === 'M' || e.key === 's' || e.key === 'S') {
        if (setupModal.classList.contains('active')) {
          closeSetup();
        } else {
          openSetup();
        }
      }
      if (e.key === 'F11') {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
    });

    // 测试服务器连通性
    if (testServerBtn) {
      testServerBtn.addEventListener('click', async () => {
        let rawUrl = serverInput.value.trim();
        if (!rawUrl) rawUrl = window.location.origin;
        if (!/^https?:\/\//i.test(rawUrl)) rawUrl = 'http://' + rawUrl;
        rawUrl = rawUrl.replace(/\/$/, '');

        testFeedback.style.color = '#38bdf8';
        testFeedback.textContent = '⏳ 正在测试连接服务器...';

        const startTime = Date.now();
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 4000);

          const res = await fetch(`${rawUrl}/health`, { signal: controller.signal });
          clearTimeout(timeoutId);
          const latency = Date.now() - startTime;

          if (res.ok) {
            testFeedback.style.color = '#34d399';
            testFeedback.textContent = `✅ 连接成功！服务器响应正常 (延迟: ${latency}ms)`;
          } else {
            testFeedback.style.color = '#f87171';
            testFeedback.textContent = `⚠️ 服务器已响应但返回错误: HTTP ${res.status}`;
          }
        } catch (err) {
          testFeedback.style.color = '#f87171';
          testFeedback.textContent = `❌ 无法连接到此服务器地址，请检查网络或域名拼写`;
        }
      });
    }

    document.getElementById('save-setup-btn').addEventListener('click', () => {
      const newCode = codeInput.value.trim().toUpperCase();
      let newServer = serverInput.value.trim();

      if (newServer && !/^https?:\/\//i.test(newServer)) {
        newServer = 'http://' + newServer;
      }

      if (newCode) {
        screenCode = newCode;
        localStorage.setItem(STORAGE_KEY_CODE, screenCode);
      } else {
        localStorage.removeItem(STORAGE_KEY_CODE);
        screenCode = null;
      }

      if (newServer) {
        serverBase = newServer.replace(/\/$/, '');
        localStorage.setItem(STORAGE_KEY_SERVER, serverBase);
      }

      closeSetup();
      if (screenCode) {
        document.getElementById('activation-screen').style.display = 'none';
        document.getElementById('app-container').style.display = 'flex';
        startPolling();
      } else {
        initPairingMode();
      }
    });

    // 解除绑定，重新进入配对模式
    document.getElementById('unpair-btn').addEventListener('click', () => {
      if (confirm('确定要解除当前电视大屏的绑定吗？解除后将重新生成激活码。')) {
        localStorage.removeItem(STORAGE_KEY_CODE);
        screenCode = null;
        closeSetup();
        initPairingMode();
      }
    });

    document.getElementById('close-setup-btn').addEventListener('click', closeSetup);

    // -------------------------------------------------------------
    // 启动入口：若已有绑定代号直接播放，若无则显示 6 位激活配对码
    // -------------------------------------------------------------
    if (screenCode) {
      document.getElementById('activation-screen').style.display = 'none';
      document.getElementById('app-container').style.display = 'flex';
      startPolling();
    } else {
      initPairingMode();
    }
  </script>
</body>
</html>
