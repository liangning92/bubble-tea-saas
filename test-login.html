<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 40px; }
    .test { margin: 10px 0; padding: 10px; border-radius: 5px; }
    .success { background: #d4edda; color: #155724; }
    .error { background: #f8d7da; color: #721c24; }
    .info { background: #d1ecf1; color: #0c5460; }
    button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    pre { background: #f5f5f5; padding: 10px; overflow: auto; }
  </style>
</head>
<body>
  <h1>🧋 Bubble Tea POS - Login Test</h1>

  <div id="results"></div>

  <script>
    const results = document.getElementById('results');

    function log(message, type = 'info') {
      const div = document.createElement('div');
      div.className = 'test ' + type;
      div.textContent = message;
      results.appendChild(div);
      console.log(message);
    }

    async function testLogin() {
      results.innerHTML = '';
      log('Starting login tests...', 'info');

      // Test 1: Check if API is reachable
      log('Test 1: Checking API server...', 'info');
      try {
        const healthRes = await fetch('http://localhost:3000/health');
        const healthData = await healthRes.json();
        log('✓ API Server OK: ' + JSON.stringify(healthData), 'success');
      } catch (e) {
        log('✗ API Server Error: ' + e.message, 'error');
      }

      // Test 2: Test login via proxy
      log('Test 2: Testing login via proxy...', 'info');
      try {
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: '081234567890', password: 'admin123' })
        });
        const loginData = await loginRes.json();
        log('Login response: ' + JSON.stringify(loginData).substring(0, 200), loginData.code === 200 ? 'success' : 'error');

        if (loginData.code === 200) {
          log('✓ Login successful!', 'success');
          log('Token: ' + loginData.data.token.substring(0, 50) + '...', 'info');
        } else {
          log('✗ Login failed: ' + loginData.message, 'error');
        }
      } catch (e) {
        log('✗ Login Error: ' + e.message, 'error');
      }

      // Test 3: Test dashboard data
      log('Test 3: Testing dashboard API...', 'info');
      try {
        const loginRes = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone: '081234567890', password: 'admin123' })
        });
        const loginData = await loginRes.json();

        if (loginData.data?.token) {
          const dashRes = await fetch('/api/reports/dashboard', {
            headers: { 'Authorization': 'Bearer ' + loginData.data.token }
          });
          const dashData = await dashRes.json();
          log('Dashboard response: ' + JSON.stringify(dashData).substring(0, 200), 'success');
        }
      } catch (e) {
        log('✗ Dashboard Error: ' + e.message, 'error');
      }
    }

    testLogin();
  </script>
</body>
</html>
